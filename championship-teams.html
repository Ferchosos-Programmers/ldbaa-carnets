<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Equipos del Campeonato | Liga Barrial</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/responsive.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/global-swal-patch.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="icon" href="img/logo.png" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/global-theme.css" />
    <link rel="stylesheet" href="css/championship-teams.css" />

    <!-- ExcelJS y FileSaver para reportes con imágenes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  </head>
  <body>
    <!-- Main Background -->
    <div class="main-bg"></div>

    <!-- Toast de nuevos jugadores -->
    <div id="newPlayersToast" class="glass-toast">
      <button
        class="toast-close"
        onclick="document.getElementById('newPlayersToast').style.display = 'none'"
      >
        <i class="fas fa-times"></i>
      </button>
      <div class="toast-title">
        <i class="fas fa-bell me-2 brand-accent"></i>Registros Nuevos
      </div>
      <div id="newPlayersToastBody"></div>
    </div>

    <!-- Botón flotante de jugadores nuevos -->
    <button id="newPlayersFloatingBtn" class="floating-btn-premium" onclick="showNewPlayersModal()">
      <i class="fas fa-users"></i>
      <span class="badge-count">0</span>
    </button>

    <!-- Navigation -->
    <nav class="nav-premium shadow-sm">
      <div class="nav-content">
        <a href="dashboard.html" class="nav-logo">
          <img src="img/logo.png" alt="Logo" />
          <span>LDBAA <span class="brand-accent">ARGELIA ALTA</span></span>
        </a>
        <div class="nav-links d-none d-md-flex">
          <a href="dashboard.html"><i class="fas fa-home me-2"></i>Dashboard</a>
          <a href="#" class="active"><i class="fas fa-id-card me-2"></i>Equipos</a>
        </div>
        <button class="btn-logout-premium" onclick="logout()">
          <i class="fas fa-sign-out-alt me-2"></i><span>Salir</span>
        </button>
      </div>
    </nav>

    <div class="container py-4">
      <div class="d-flex align-items-center mb-5">
        <a href="dashboard.html" class="btn-secondary-glass me-4" style="border-radius: 50%; width: 50px; height: 50px; padding: 0;">
          <i class="fas fa-arrow-left"></i>
        </a>
        <div>
          <h2 class="section-title mb-0" id="championshipTitle" style="text-align: left;">EQUIPOS DEL CAMPEONATO</h2>
          <p class="text-white-50 mb-0" id="championshipDescription"></p>
        </div>
        
        <div class="ms-auto d-flex gap-3">
          <button class="btn-secondary-glass px-4" onclick="exportarJugadoresCampeonatoExcel()">
            <i class="fas fa-file-excel me-2"></i>Exportar Reporte
          </button>
          <button class="btn-premium px-4" data-bs-toggle="modal" data-bs-target="#addTeamModal">
            <i class="fas fa-plus-circle me-2"></i>Agregar Equipo
          </button>
        </div>
      </div>

      <!-- Filter Section -->
      <div class="filter-grid mb-5">
        <div class="input-group-premium">
          <i class="fas fa-search"></i>
          <input type="text" id="teamSearchInput" class="search-input" placeholder="Buscar equipo por nombre..." oninput="filterTeamsLocal()">
        </div>
        
        <select id="teamCategoryFilter" class="select-premium" onchange="filterTeamsLocal()">
          <option value="">TODAS LAS CATEGORÍAS</option>
          <option value="MÁXIMA">MÁXIMA</option>
          <option value="PRIMERA">PRIMERA</option>
          <option value="FEMENINO">FEMENINO</option>
        </select>
      </div>

      <!-- Contenedor de tarjetas -->
      <div class="row" id="teamCardsContainer">
        <!-- Se cargan dinámicamente -->
      </div>
    </div>

    <!-- Modal para agregar equipo -->
    <div class="modal fade" id="addTeamModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content modal-premium">
          <form id="teamForm">
            <div class="modal-header">
              <h5 class="modal-title">
                <i class="fas fa-plus-circle me-2 brand-accent"></i>REGISTRAR EQUIPO
              </h5>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <div class="mb-4">
                <label for="teamLogo" class="form-label">LOGO DEL EQUIPO</label>
                <input type="file" class="input-premium" id="teamLogo" accept="image/*" required />
              </div>
              <div class="mb-4">
                <label for="teamName" class="form-label">NOMBRE DEL EQUIPO</label>
                <input type="text" class="input-premium" id="teamName" placeholder="Ej: Águilas Negras" required />
              </div>
              <div class="mb-4">
                <label for="teamCategory" class="form-label">CATEGORÍA</label>
                <select class="select-premium" id="teamCategory" required>
                  <option value="">Selecciona una categoría</option>
                  <option value="MÁXIMA">MÁXIMA</option>
                  <option value="PRIMERA">PRIMERA</option>
                  <option value="FEMENINO">FEMENINO</option>
                </select>
              </div>
            </div>
            <div class="modal-footer border-0">
              <button type="submit" class="btn-premium w-100 justify-content-center py-3">
                <i class="fas fa-save me-2"></i> GUARDAR EQUIPO
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Modal para gestionar archivos -->
    <div class="modal fade" id="manageFilesModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content modal-premium">
          <div class="modal-header">
            <h5 class="modal-title" id="manageFilesModalLabel">
              <i class="fas fa-folder-open me-2 brand-accent"></i>GESTIONAR ARCHIVOS
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="fileUploadForm">
              <div class="mb-4">
                <label for="fileType" class="form-label">TIPO DE DOCUMENTO</label>
                <select class="select-premium" id="fileType" required>
                  <option value="">Selecciona el tipo de documento</option>
                  <option value="carta_pase">Carta de Pase</option>
                  <option value="autorizacion">Autorización</option>
                  <option value="otro">Otro Documento</option>
                </select>
              </div>
              <div class="mb-4">
                <label for="fileUpload" class="form-label">ARCHIVO PDF</label>
                <input type="file" class="input-premium" id="fileUpload" accept=".pdf" required />
              </div>
              <button type="submit" class="btn-premium w-100 justify-content-center py-3">
                <i class="fas fa-upload me-2"></i> SUBIR ARCHIVO
              </button>
            </form>

            <hr class="my-4" />

            <h6>Archivos Subidos</h6>
            <div id="filesList" class="list-group">
              <!-- Los archivos se cargarán dinámicamente aquí -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal para ver PDF -->
    <div
      class="modal fade"
      id="viewPdfModal"
      tabindex="-1"
      aria-labelledby="viewPdfModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content" style="height: 90vh">
          <div class="modal-header">
            <h5 class="modal-title" id="viewPdfModalLabel">Ver Archivo PDF</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body p-0" style="height: 80vh">
            <iframe
              id="pdfViewerFrame"
              src=""
              style="width: 100%; height: 100%"
              frameborder="0"
            ></iframe>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal de jugadores nuevos -->
    <div
      class="modal fade"
      id="newPlayersModal"
      tabindex="-1"
      aria-labelledby="newPlayersModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg">
        <div class="modal-content shadow">
          <div class="modal-header">
            <h5 class="modal-title" id="newPlayersModalLabel">
              Jugadores Nuevos Registrados
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div id="newPlayersList">
              <!-- Los jugadores se cargarán dinámicamente aquí -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-storage.js"></script>

    <script>
      // Configuración de Firebase
      const firebaseConfig = {
        apiKey: "AIzaSyAzRTlx96sL8rxcgLauftrTWpr5VlwjV00",
        authDomain: "ldbaa-calificaciones.firebaseapp.com",
        projectId: "ldbaa-calificaciones",
        storageBucket: "ldbaa-calificaciones.appspot.com",
        messagingSenderId: "277579489603",
        appId: "1:277579489603:web:bc93c22fea5f5f6b63cff6",
      };

      // Inicializar Firebase
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }

      const db = firebase.firestore();
      const auth = firebase.auth();
      let championshipId = null;
      let isAdmin = false;
      let championshipListener = null; // Variable para almacenar el listener del campeonato

      // Verificar estado de autenticación
      auth.onAuthStateChanged((user) => {
        if (!user) {
          window.location.href = "login.html";
          return;
        }
        // Obtener el ID del campeonato de la URL
        const urlParams = new URLSearchParams(window.location.search);
        championshipId = urlParams.get("id");
        if (!championshipId) {
          window.location.href = "dashboard.html";
          return;
        }
        loadChampionshipInfo();
        loadTeams();
        // Mostrar toast y botón solo a admin
        isAdmin = user.email === "admin@gmail.com";
        if (isAdmin) {
          showNewPlayersToast();
          checkNewPlayers();
          // Asegúrate de mostrar el botón aunque no haya jugadores nuevos
          document.getElementById("newPlayersFloatingBtn").style.display =
            "block";

          // Escuchar cambios en el campeonato para actualizar notificaciones
          championshipListener = db
            .collection("championships")
            .doc(championshipId)
            .onSnapshot((doc) => {
              if (doc.exists) {
                const championship = doc.data();
                // Si la fecha de deadline cambió, actualizar las notificaciones
                if (championship.deadlineLastChanged) {
                  console.log(
                    "Fecha de deadline actualizada, recargando notificaciones...",
                  );
                  showNewPlayersToast();
                  checkNewPlayers();
                }
              }
            });
        } else {
          document.getElementById("newPlayersFloatingBtn").style.display =
            "none";
        }
      });

      // Cargar información del campeonato
      function loadChampionshipInfo() {
        db.collection("championships")
          .doc(championshipId)
          .get()
          .then((doc) => {
            if (doc.exists) {
              const championship = doc.data();
              document.getElementById("championshipTitle").textContent =
                championship.name;
              document.getElementById("championshipDescription").textContent =
                championship.description || "";
            }
          })
          .catch((error) => {
            console.error("Error al cargar información del campeonato:", error);
            Swal.fire(
              "Error",
              "No se pudo cargar la información del campeonato",
              "error",
            );
          });
      }

      let allTeamsLocal = [];

      // Cargar equipos
      function loadTeams() {
        const container = document.getElementById("teamCardsContainer");
        container.innerHTML = '<div class="col-12 text-center"><div class="spinner-border text-success" role="status"></div></div>';

        db.collection("teams")
          .where("championshipId", "==", championshipId)
          .get()
          .then((querySnapshot) => {
            container.innerHTML = "";
            allTeamsLocal = [];
            if (querySnapshot.empty) {
              container.innerHTML = '<div class="col-12 text-center"><p class="text-white-50">No hay equipos registrados</p></div>';
              return;
            }

            querySnapshot.forEach((doc) => {
              const team = doc.data();
              team.id = doc.id;
              allTeamsLocal.push(team);
            });
            renderTeams(allTeamsLocal);
          })
          .catch((error) => {
            console.error("Error al cargar equipos:", error);
            Swal.fire("Error", "No se pudieron cargar los equipos", "error");
          });
      }

      function filterTeamsLocal() {
        const term = document.getElementById('teamSearchInput').value.toLowerCase();
        const cat = document.getElementById('teamCategoryFilter').value;
        const filtered = allTeamsLocal.filter(t => {
          const matchName = t.name.toLowerCase().includes(term);
          const matchCat = !cat || t.category === cat;
          return matchName && matchCat;
        });
        renderTeams(filtered);
      }

      function renderTeams(teams) {
        const container = document.getElementById("teamCardsContainer");
        container.innerHTML = "";
        teams.forEach(team => createTeamCard(team.id, team));
      }

      // Crear tarjeta de equipo
      function createTeamCard(id, team) {
        const card = document.createElement("div");
        card.className = "col-md-4 mb-4";
        card.innerHTML = `
        <div class="dashboard-card h-100 p-4 text-center">
          <div class="card-icon-wrapper mb-4" style="width: 100px; height: 100px; margin: 0 auto;">
            <img src="${team.logo || 'img/logo.png'}" alt="Logo" style="width: 70%; height: 70%; object-fit: contain;">
          </div>
          <h4 class="text-white mb-2 fw-bold text-uppercase">${team.name}</h4>
          <span class="badge badge-secondary-glass mb-4">${team.category}</span>
          
          <div class="d-grid gap-2 w-100 mt-auto">
            <button class="btn btn-success-premium w-100 py-2" onclick="gestionarArchivos('${id}', '${team.name}')">
              <i class="fas fa-folder-open me-2"></i>DOCUMENTACIÓN
            </button>
            <div class="d-flex gap-2">
              <button class="btn btn-secondary-glass flex-grow-1" title="Resetear Clave" onclick="resetAdminKey('${id}')">
                <i class="fas fa-key text-warning"></i>
              </button>
              <button class="btn btn-secondary-glass flex-grow-1" title="Eliminar Equipo" onclick="deleteTeam('${id}')">
                <i class="fas fa-trash text-danger"></i>
              </button>
            </div>
          </div>
        </div>
      `;
        document.getElementById("teamCardsContainer").appendChild(card);
      }

      // Manejar el envío del formulario de equipo
      document
        .getElementById("teamForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const name = document.getElementById("teamName").value.toUpperCase();
          const category = document
            .getElementById("teamCategory")
            .value.toUpperCase();
          const logoInput = document.getElementById("teamLogo");
          const reader = new FileReader();

          reader.onload = function () {
            const logoURL = reader.result;
            const teamData = {
              name,
              category,
              logo: logoURL,
              championshipId,
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            };

            db.collection("teams")
              .add(teamData)
              .then(() => {
                Swal.fire({
                  title: "Éxito",
                  text: "Equipo agregado correctamente",
                  icon: "success",
                });
                document.getElementById("teamForm").reset();
                const modal = bootstrap.Modal.getInstance(
                  document.getElementById("addTeamModal"),
                );
                modal.hide();
                loadTeams();
              })
              .catch((error) => {
                console.error("Error al agregar equipo:", error);
                Swal.fire("Error", "No se pudo agregar el equipo", "error");
              });
          };

          reader.readAsDataURL(logoInput.files[0]);
        });

      // Función para eliminar equipo
      function deleteTeam(teamId) {
        Swal.fire({
          title: "¿Estás seguro?",
          text: "Este equipo será eliminado permanentemente",
          icon: "warning",
          showCancelButton: true,
          confirmButtonText: "Sí, eliminar",
          cancelButtonText: "Cancelar",
        }).then((result) => {
          if (result.isConfirmed) {
            db.collection("teams")
              .doc(teamId)
              .delete()
              .then(() => {
                Swal.fire(
                  "Eliminado",
                  "El equipo ha sido eliminado",
                  "success",
                );
                loadTeams();
              })
              .catch((error) => {
                console.error("Error al eliminar equipo:", error);
                Swal.fire("Error", "No se pudo eliminar el equipo", "error");
              });
          }
        });
      }

      // Función para resetear la clave de administrador
      function resetAdminKey(teamId) {
        Swal.fire({
          title: "¿Resetear la clave?",
          text: "Se eliminará la clave actual y se deberá establecer una nueva la próxima vez que se acceda al registro de jugadores.",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#28a745",
          cancelButtonColor: "#d33",
          confirmButtonText: "Sí, resetear",
          cancelButtonText: "Cancelar",
        }).then((result) => {
          if (result.isConfirmed) {
            db.collection("teams")
              .doc(teamId)
              .update({
                adminKey: null,
              })
              .then(() => {
                Swal.fire({
                  title: "¡Clave reseteada!",
                  text: "La clave ha sido eliminada. Se solicitará una nueva clave la próxima vez que se acceda al registro de jugadores.",
                  icon: "success",
                });
              })
              .catch((error) => {
                console.error("Error al resetear la clave:", error);
                Swal.fire("Error", "No se pudo resetear la clave", "error");
              });
          }
        });
      }

      // Función para gestionar archivos
      function gestionarArchivos(teamId, teamName) {
        const modal = new bootstrap.Modal(
          document.getElementById("manageFilesModal"),
        );
        document.getElementById("manageFilesModalLabel").textContent =
          `Gestionar Archivos - ${teamName}`;

        // Cargar archivos existentes
        loadTeamFiles(teamId);

        // Manejar el envío del formulario
        document.getElementById("fileUploadForm").onsubmit = function (e) {
          e.preventDefault();
          const fileType = document.getElementById("fileType").value;
          const file = document.getElementById("fileUpload").files[0];

          if (!file || !fileType) {
            Swal.fire(
              "Error",
              "Por favor selecciona un tipo de documento y un archivo",
              "error",
            );
            return;
          }

          const reader = new FileReader();
          reader.onload = function (event) {
            const base64PDF = event.target.result; // PDF en base64

            db.collection("teamFiles")
              .add({
                teamId: teamId,
                fileName: file.name,
                fileType: fileType,
                fileBase64: base64PDF,
                uploadedAt: firebase.firestore.FieldValue.serverTimestamp(),
              })
              .then(() => {
                Swal.fire("Éxito", "Archivo subido correctamente", "success");
                document.getElementById("fileUploadForm").reset();
                loadTeamFiles(teamId); // Recarga la lista de archivos
              })
              .catch((error) => {
                console.error("Error al subir archivo:", error);
                Swal.fire("Error", "No se pudo subir el archivo", "error");
              });
          };
          reader.readAsDataURL(file); // Convierte el PDF a base64
        };

        modal.show();
      }

      // Función para cargar archivos del equipo
      function loadTeamFiles(teamId) {
        const filesList = document.getElementById("filesList");
        filesList.innerHTML =
          '<div class="text-center"><div class="spinner-border text-success" role="status"></div></div>';

        db.collection("teamFiles")
          .where("teamId", "==", teamId)
          .orderBy("uploadedAt", "desc")
          .get()
          .then((querySnapshot) => {
            filesList.innerHTML = "";
            if (querySnapshot.empty) {
              filesList.innerHTML =
                '<p class="text-center">No hay archivos subidos</p>';
              return;
            }

            querySnapshot.forEach((doc) => {
              const file = doc.data();
              const fileItem = document.createElement("div");
              fileItem.className =
                "list-group-item d-flex justify-content-between align-items-center";
              fileItem.innerHTML = `
                <div>
                  <strong>${file.fileName}</strong>
                  <br>
                  <small class="text-muted">Tipo: ${file.fileType
                    .replace("_", " ")
                    .toUpperCase()}</small>
                </div>
                <div>
                  <button class="btn btn-info btn-sm me-2" onclick="verArchivo('${
                    file.fileBase64
                  }')">
                    <i class="fas fa-eye"></i> Ver
                  </button>
                  <button class="btn btn-danger btn-sm" onclick="deleteFile('${
                    doc.id
                  }', '${teamId}')">
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
              `;
              filesList.appendChild(fileItem);
            });
          })
          .catch((error) => {
            console.error("Error al cargar archivos:", error);
            filesList.innerHTML =
              '<p class="text-center text-danger">Error al cargar los archivos</p>';
          });
      }

      // Función para eliminar archivo
      function deleteFile(fileId, teamId) {
        Swal.fire({
          title: "¿Eliminar archivo?",
          text: "Esta acción no se puede deshacer",
          icon: "warning",
          showCancelButton: true,
          confirmButtonText: "Sí, eliminar",
          cancelButtonText: "Cancelar",
        }).then((result) => {
          if (result.isConfirmed) {
            // Eliminar la referencia de Firestore
            db.collection("teamFiles")
              .doc(fileId)
              .delete()
              .then(() => {
                Swal.fire(
                  "Eliminado",
                  "El archivo ha sido eliminado",
                  "success",
                );
                loadTeamFiles(teamId);
              })
              .catch((error) => {
                console.error("Error al eliminar archivo:", error);
                Swal.fire("Error", "No se pudo eliminar el archivo", "error");
              });
          }
        });
      }

      // Función para ver el archivo PDF
      function verArchivo(base64PDF) {
        // Cierra el modal de gestionar archivos si está abierto
        const manageFilesModal = bootstrap.Modal.getInstance(
          document.getElementById("manageFilesModal"),
        );
        if (manageFilesModal) {
          manageFilesModal.hide();
        }

        // Establece el src del iframe al PDF en base64
        document.getElementById("pdfViewerFrame").src = base64PDF;
        // Muestra el modal de ver PDF
        const pdfModal = new bootstrap.Modal(
          document.getElementById("viewPdfModal"),
        );
        pdfModal.show();
      }

      // Función para cerrar sesión
      function logout() {
        Swal.fire({
          title: "¿Cerrar sesión?",
          text: "¿Estás seguro de que deseas salir?",
          icon: "warning",
          showCancelButton: true,
          confirmButtonText: "Sí, salir",
          cancelButtonText: "Cancelar",
        }).then((result) => {
          if (result.isConfirmed) {
            // Limpiar el listener del campeonato
            if (championshipListener) {
              championshipListener();
            }

            auth
              .signOut()
              .then(() => {
                window.location.href = "login.html";
              })
              .catch((error) => {
                console.error("Error al cerrar sesión:", error);
                Swal.fire("Error", "No se pudo cerrar la sesión", "error");
              });
          }
        });
      }

      // Limpiar listener cuando se cierre la página
      window.addEventListener("beforeunload", function () {
        if (championshipListener) {
          championshipListener();
        }
      });

      document
        .getElementById("viewPdfModal")
        .addEventListener("hidden.bs.modal", function () {
          // Reabrir el modal de gestionar archivos si lo deseas
          const manageFilesModal = new bootstrap.Modal(
            document.getElementById("manageFilesModal"),

      // Toast de nuevos jugadores registrados
      async function showNewPlayersToast() {
        try {
          // Obtener la fecha límite del campeonato
          const champDoc = await db
            .collection("championships")
            .doc(championshipId)
            .get();
          if (!champDoc.exists) return;
          const championship = champDoc.data();
          if (!championship.deadline) return;
          const deadline = new Date(championship.deadline);

          // Usar la fecha de inicio de notificaciones si existe, sino usar 30 días antes
          let startDate;
          if (championship.deadlineLastChanged) {
            startDate = new Date(championship.deadlineLastChanged.toDate());
          } else if (championship.notificationStartDate) {
            startDate = new Date(championship.notificationStartDate);
          } else {
            // Fallback: considerar 30 días antes de la fecha límite
            startDate = new Date(deadline.getTime() - 30 * 24 * 60 * 60 * 1000);
          }

          // Consultar jugadores registrados en ese periodo y campeonato
          const playersSnapshot = await db
            .collection("players")
            .where("campeonatoId", "==", championshipId)
            .where("createdAt", ">=", startDate)
            .where("createdAt", "<=", deadline)
            .get();

          if (playersSnapshot.empty) return;

          // Agrupar por equipo
          const teamMap = {};
          playersSnapshot.forEach((doc) => {
            const player = doc.data();
            if (!player.teamName) return;
            if (!teamMap[player.teamName]) {
              teamMap[player.teamName] = 0;
            }
            teamMap[player.teamName]++;
          });

          // Si no hay equipos con jugadores nuevos, no mostrar
          const teamNames = Object.keys(teamMap);
          if (teamNames.length === 0) return;

          // Construir HTML
          let html = '<ul style="margin-bottom:0; padding-left: 18px;">';
          teamNames.forEach((name) => {
            html += `<li><b>${name}</b> <span class='text-muted'>(${
              teamMap[name]
            } jugador${teamMap[name] > 1 ? "es" : ""})</span></li>`;
          });
          html += "</ul>";

          document.getElementById("newPlayersToastBody").innerHTML = html;
          document.getElementById("newPlayersToast").style.display = "block";
          // Ocultar automáticamente después de 10 segundos
          setTimeout(() => {
            document.getElementById("newPlayersToast").style.display = "none";
          }, 10000);
        } catch (e) {
          console.error("Error mostrando toast de nuevos jugadores:", e);
        }
      }

          let startDate;

          } else if (championship.notificationStartDate) {

          } else {
            // Fallback: considerar 30 días antes de la fecha límite

      // Mostrar modal con jugadores nuevos
      async function showNewPlayersModal() {
        if (!window.newPlayersData || window.newPlayersData.length === 0) {
          Swal.fire("Info", "No hay jugadores nuevos para mostrar", "info");
          return;
        }

              periodInfo = `
                <div class="alert alert-info mb-3">

                  ${

                }</div>

                  <strong>Número:</strong> ${

                  }<br>
                  <strong>Categoría:</strong> ${
                    player.teamCategory || "No especificada"
                  }<br>
                  <strong>Fecha de registro:</strong> ${

                      ? new Date(player.createdAt.toDate()).toLocaleDateString(

        playersList.innerHTML = html;

        // Mostrar el modal

      // Función para calcular la edad
      function calcularEdad(fechaNacimiento) {
        if (!fechaNacimiento) return 0;
        const hoy = new Date();
        const fechaNac = new Date(fechaNacimiento);
        let edad = hoy.getFullYear() - fechaNac.getFullYear();
        const mes = hoy.getMonth() - fechaNac.getMonth();

        if (mes < 0 || (mes === 0 && hoy.getDate() < fechaNac.getDate())) {
          edad--;
        }

        return edad;
      }

      // Función para verificar si es juvenil (< 18 años)
      function esJuvenil(fechaNacimiento) {
        return calcularEdad(fechaNacimiento) < 18;
      }

      // Función para verificar si es master (> 40 años)
      function esMaster(fechaNacimiento) {
        return calcularEdad(fechaNacimiento) > 40;
      }

      // Función para exportar todos los jugadores del campeonato actual a Excel con Fotos
      async function exportarJugadoresCampeonatoExcel() {
        try {
          // 1. Selección de Rango de Edad (Múltiple)
          const { value: ageFilters } = await Swal.fire({
            title: "Seleccionar Rango de Edad",
            html: `
              <div class="text-start p-2">
                <div class="form-check mb-2">
                  <input class="form-check-input" type="checkbox" value="senior" id="age_senior" checked>
                  <label class="form-check-label" for="age_senior">Senior (Normal)</label>
                </div>
                <div class="form-check mb-2">
                  <input class="form-check-input" type="checkbox" value="master" id="age_master" checked>
                  <label class="form-check-label" for="age_master">Master (> 40 años)</label>
                </div>
                <div class="form-check mb-2">
                  <input class="form-check-input" type="checkbox" value="juvenil" id="age_juvenil" checked>
                  <label class="form-check-label" for="age_juvenil">Juvenil (< 18 años)</label>
                </div>
              </div>
            `,
            focusConfirm: false,
            confirmButtonText: "Siguiente",
            showCancelButton: true,
            cancelButtonText: "Cancelar",
            preConfirm: () => {
              const selected = [];
              if (document.getElementById("age_senior").checked)
                selected.push("senior");
              if (document.getElementById("age_master").checked)
                selected.push("master");
              if (document.getElementById("age_juvenil").checked)
                selected.push("juvenil");
              if (selected.length === 0) {
                Swal.showValidationMessage(
                  "Debes seleccionar al menos una opción",
                );
              }
              return selected;
            },
          });

          if (!ageFilters) return;

          // 2. Selección de Divisiones (Múltiple)
          const { value: divisionFilters } = await Swal.fire({
            title: "Seleccionar Divisiones",
            html: `
              <div class="text-start p-2">
                <div class="form-check mb-2">
                  <input class="form-check-input" type="checkbox" value="MÁXIMA" id="div_maxima" checked>
                  <label class="form-check-label" for="div_maxima">MÁXIMA</label>
                </div>
                <div class="form-check mb-2">
                  <input class="form-check-input" type="checkbox" value="PRIMERA" id="div_primera" checked>
                  <label class="form-check-label" for="div_primera">PRIMERA</label>
                </div>
                <div class="form-check mb-2">
                  <input class="form-check-input" type="checkbox" value="FEMENINO" id="div_femenino" checked>
                  <label class="form-check-label" for="div_femenino">FEMENINO</label>
                </div>
              </div>
            `,
            focusConfirm: false,
            confirmButtonText: "Siguiente",
            showCancelButton: true,
            cancelButtonText: "Cancelar",
            preConfirm: () => {
              const selected = [];
              if (document.getElementById("div_maxima").checked)
                selected.push("MÁXIMA");
              if (document.getElementById("div_primera").checked)
                selected.push("PRIMERA");
              if (document.getElementById("div_femenino").checked)
                selected.push("FEMENINO");
              if (selected.length === 0) {
                Swal.showValidationMessage(
                  "Debes seleccionar al menos una opción",
                );
              }
              return selected;
            },
          });

          if (!divisionFilters) return;

          // 3. Incluir Fotografías
          const { value: incluirFotos } = await Swal.fire({
            title: "Incluir Fotografías",
            text: "¿Deseas incluir las fotos de los jugadores en el reporte? (Esto puede tardar un poco más por el volumen de datos)",
            icon: "question",
            showCancelButton: true,
            confirmButtonText: "Sí, incluir fotos",
            cancelButtonText: "No, solo texto",
          });

          if (incluirFotos === undefined) return; // Cancelado

          const procesarFotos = incluirFotos === true;

          Swal.fire({
            title: "Preparando reporte...",
            html: "Obteniendo datos... <br><b><span id='exportProgress'>0</span></b> jugadores procesados",
            allowOutsideClick: false,
            didOpen: () => {
              Swal.showLoading();
            },
          });

          // 1. Obtener todos los equipos de este campeonato
          const teamsSnapshot = await db
            .collection("teams")
            .where("championshipId", "==", championshipId)
            .get();

          const teamIds = new Set();
          const teamNamesMap = {};
          const teamCategoriesMap = {};

          teamsSnapshot.forEach((doc) => {
            teamIds.add(doc.id);
            const data = doc.data();
            teamNamesMap[doc.id] = data.name;
            teamCategoriesMap[doc.id] = data.category;
          });

          // 2. Obtener todos los jugadores
          const snapshot = await db.collection("players").get();

          if (snapshot.empty) {
            Swal.fire("Atención", "No hay jugadores registrados", "info");
            return;
          }

          const playersToExport = [];
          snapshot.forEach((doc) => {
            const player = doc.data();
            if (
              teamIds.has(player.teamId) ||
              player.campeonatoId === championshipId
            ) {
              // Filtrar por Rango de Edad
              let matchAge = false;
              const edad = calcularEdad(player.fechaNacimiento);
              if (ageFilters.includes("juvenil") && edad < 18) matchAge = true;
              else if (ageFilters.includes("master") && edad > 40)
                matchAge = true;
              else if (
                ageFilters.includes("senior") &&
                edad >= 18 &&
                edad <= 40
              )
                matchAge = true;

              if (matchAge) {
                // Filtrar por División de Equipo
                const teamCat = (
                  player.teamCategory ||
                  teamCategoriesMap[player.teamId] ||
                  ""
                ).toUpperCase();
                if (divisionFilters.includes(teamCat)) {
                  playersToExport.push({
                    ...player,
                    clubRef: (
                      player.teamName ||
                      teamNamesMap[player.teamId] ||
                      "SIN ASIGNAR"
                    ).toUpperCase(),
                    catRef: (
                      player.teamCategory ||
                      teamCategoriesMap[player.teamId] ||
                      ""
                    ).toUpperCase(),
                  });
                }
              }
            }
          });

          if (playersToExport.length === 0) {
            Swal.fire(
              "Atención",
              "No se encontraron jugadores para los filtros seleccionados.",
              "info",
            );
            return;
          }

          // Ordenar por Equipo y luego por Categoría
          playersToExport.sort((a, b) => {
            if (a.clubRef < b.clubRef) return -1;
            if (a.clubRef > b.clubRef) return 1;
            if (a.catRef < b.catRef) return -1;
            if (a.catRef > b.catRef) return 1;
            return 0;
          });

          // 3. Crear el libro de Excel con ExcelJS
          const workbook = new ExcelJS.Workbook();
          const worksheet = workbook.addWorksheet("Lista de Jugadores");

          // Definir columnas
          const columns = [
            { header: "FOTO", key: "foto", width: 15 },
            { header: "NÚMERO", key: "numero", width: 12 },
            { header: "NOMBRES", key: "nombres", width: 35 },
            { header: "APELLIDOS", key: "apellidos", width: 35 },
            { header: "CÉDULA", key: "cedula", width: 20 },
            { header: "CLUB/EQUIPO", key: "club", width: 40 },
            { header: "CATEGORÍA", key: "categoria", width: 20 },
            { header: "ESTADO", key: "estado", width: 20 },
          ];
          worksheet.columns = columns;

          // Estilo para el encabezado
          worksheet.getRow(1).font = { bold: true };
          worksheet.getRow(1).height = 25;
          worksheet.getRow(1).alignment = {
            vertical: "middle",
            horizontal: "center",
          };

          // 4. Agregar jugadores y sus imágenes
          for (let i = 0; i < playersToExport.length; i++) {
            const player = playersToExport[i];
            const rowIndex = i + 2; // +1 por encabezado

            const row = worksheet.addRow({
              numero: player.numeroJugador || "S/N",
              nombres: (player.nombres || "").toUpperCase(),
              apellidos: (player.apellidos || "").toUpperCase(),
              cedula: player.cedula || "",
              club: player.clubRef,
              categoria: player.catRef,
              estado:
                player.status === "recalificado"
                  ? "RECALIFICADO"
                  : "CALIFICADO",
            });

            row.alignment = { vertical: "middle" };

            // Agregar foto si se solicitó
            if (procesarFotos && player.playerPhoto) {
              row.height = 90;
              try {
                if (player.playerPhoto.startsWith("data:image")) {
                  const parts = player.playerPhoto.split(",");
                  const extension = parts[0].split("/")[1].split(";")[0];
                  const base64Data = parts[1];

                  const imageId = workbook.addImage({
                    base64: base64Data,
                    extension: extension,
                  });

                  worksheet.addImage(imageId, {
                    tl: { col: 0.1, row: rowIndex - 0.9 },
                    ext: { width: 80, height: 110 },
                  });
                } else if (player.playerPhoto.startsWith("http")) {
                  row.getCell("foto").value = {
                    text: "Ver Foto",
                    hyperlink: player.playerPhoto,
                  };
                }
              } catch (err) {
                console.warn("Error con foto del jugador:", player.cedula, err);
              }
            }

            // Actualizar progreso
            if (i % 5 === 0) {
              const progressEl = document.getElementById("exportProgress");
              if (progressEl)
                progressEl.textContent = `${i} / ${playersToExport.length}`;
            }
          }

          // 5. Descargar archivo
          const champTitle = document
            .getElementById("championshipTitle")
            .textContent.trim();
          const champName = champTitle.replace(/\s+/g, "_");
          const fecha = new Date()
            .toLocaleDateString("es-ES")
            .replace(/\//g, "-");

          const buffer = await workbook.xlsx.writeBuffer();
          const blob = new Blob([buffer], {
            type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
          });
          saveAs(blob, `Reporte_Filtros_${champName}_${fecha}.xlsx`);

          Swal.fire({
            title: "¡Éxito!",
            text: `El reporte de jugadores se ha generado correctamente con los filtros seleccionados.`,
            icon: "success",
          });
        } catch (error) {
          console.error("Error al exportar a Excel:", error);
          Swal.fire({
            title: "Error",
            text: "No se pudo generar el reporte. El volumen de imágenes podría ser muy alto para el navegador.",
            icon: "error",
          });
        }
      }
    </script>
