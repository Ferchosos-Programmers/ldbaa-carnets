<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Sanciones | Liga Barrial</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"

    <link rel="icon" href="img/logo.png" />

    <link rel="stylesheet" href="css/index.css" />

  <body>
    <!-- Navbar -->
    <!-- Main Background -->
    <div class="main-bg"></div>

    <!-- Navigation -->
    <nav class="nav-premium shadow-sm">
      <div class="nav-content">
        <a href="index.html" class="nav-logo">
          <img src="img/logo.png" alt="Logo" />
          <span>LDBAA <span class="brand-accent">ARGELIA ALTA</span></span>
        </a>
        <div class="nav-links d-none d-md-flex">
          <a href="programacion-dashboard.html"><i class="fas fa-home me-2"></i>Dashboard</a>
          <a href="#" class="active"><i class="fas fa-gavel me-2"></i>Sanciones</a>

    <div class="container py-5">
      <div class="text-center mb-5">
        <h2 class="section-title">
          <i class="fas fa-gavel me-2"></i>Gestión de Sanciones
        </h2>
        <p class="text-white-50">
          Administra disciplina, tarjetas y multas de forma centralizada y
          moderna.
        </p>
      </div>

      <!-- Sección de Campeonatos -->
      <div id="campeonatosSection" class="row">
        <!-- Se llena dinámicamente -->
      </div>

      <div id="equiposSection" class="row" style="display: none">
        <div class="col-12 mb-4 d-flex justify-content-between align-items-center">
          <button class="btn-secondary-glass" onclick="volverACampeonatos()">
            <i class="fas fa-arrow-left me-2"></i> Volver
          </button>
          <h4 class="mb-0 brand-accent text-uppercase fw-bold" id="equiposTitulo"></h4>
        </div>
        
        <div class="col-12 mb-5">
          <div class="filter-grid">
            <div class="input-group-premium">
              <i class="fas fa-search"></i>
              <input type="text" id="searchEquipoInput" class="search-input" placeholder="Buscar equipo por nombre...">
            </div>
            
            <select id="categoryEquipoFilter" class="select-premium">
              <option value="">TODAS LAS CATEGORÍAS</option>
              <option value="MÁXIMA">MÁXIMA</option>
              <option value="PRIMERA">PRIMERA</option>
              <option value="FEMENINO">FEMENINO</option>
            </select>
          </div>
        </div>
        <div class="col-12">
          <div class="row" id="equiposLista">
            <!-- Se llena dinámicamente -->
          </div>
        </div>
      </div>

      <!-- Sección de Jugadores (inicialmente oculta) -->
      <div id="jugadoresSection" class="row" style="display: none">
        <div
          class="col-12 mb-4 d-flex justify-content-between align-items-center"
        >
          <button class="btn btn-secondary-glass" onclick="volverAEquipos()">
            <i class="fas fa-arrow-left me-2"></i> Volver a Equipos
          </button>
          <h4
            class="mb-0 text-info text-uppercase fw-bold"
            id="jugadoresTitulo"
          ></h4>
        </div>
        <div class="col-12 mb-5">
          <div class="input-group-premium">
            <i class="fas fa-search"></i>
            <input type="text" id="searchJugadorInput" class="search-input" placeholder="Buscar por nombre o número de jugador...">
          </div>
        </div>
        <div class="col-12">
          <div class="glass-card p-0 overflow-hidden">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead>
                  <tr class="table-premium-header">
                    <th class="ps-4">#</th>
                    <th>JUGADOR</th>
                    <th class="text-center">TARJETAS</th>
                    <th>SANCIONES ACTIVAS</th>
                    <th class="text-center pe-4">ACCIONES</th>

                </thead>
                <tbody id="jugadoresTableBody">

              </table>

          </div>
        </div>

    <!-- Modals Section -->
    <div class="modal fade" id="sancionModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content modal-premium">
          <div class="modal-header">
            <h5 class="modal-title">
              <i class="fas fa-gavel me-2 brand-accent"></i>APLICAR SANCIÓN
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="sancionForm">
              <input type="hidden" id="jugadorId" />
              <div class="mb-4">
                <label class="form-label">TIPO DE SANCIÓN</label>
                <select class="select-premium" id="tipoSancion" required>
                  <option value="">Seleccione tipo</option>
                  <option value="amarilla">TARJETA AMARILLA 🟨</option>
                  <option value="roja">TARJETA ROJA 🟥</option>
                </select>
              </div>
              <div id="articuloLiteralContainer" style="display: none">
                <div class="mb-4">
                  <label class="form-label">ARTÍCULO</label>
                  <select class="select-premium" id="articulo" onchange="actualizarLiterales()">
                    <option value="">Seleccione artículo</option>
                    <option value="124">Art. 124 - 1 PARTIDO</option>
                    <option value="125">Art. 125 - 2 PARTIDOS</option>
                    <option value="126">Art. 126 - 3 PARTIDOS</option>
                    <option value="127">Art. 127 - 4 PARTIDOS</option>
                    <option value="128">Art. 128 - 6 PARTIDOS</option>
                    <option value="129">Art. 129 - 1 AÑO</option>
                  </select>
                </div>
                <div class="mb-4">
                  <label class="form-label">LITERAL</label>
                  <select class="select-premium" id="literal">
                    <option value="">Seleccione primero un artículo</option>
                  </select>
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer border-0">
            <button type="button" class="btn btn-secondary-glass" data-bs-dismiss="modal">CANCELAR</button>
            <button type="button" class="btn btn-success-premium" onclick="aplicarSancion()">CONFIRMAR SANCIÓN</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal para Aplicar Multa -->
    <div class="modal fade" id="multaModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content modal-premium">
          <div class="modal-header">
            <h5 class="modal-title text-danger">
              <i class="fas fa-dollar-sign me-2"></i>APLICAR MULTA
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="multaForm">
              <input type="hidden" id="multaJugadorId" />
              <div class="mb-4">
                <label class="form-label">TIPO DE MULTA</label>
                <select class="select-premium" id="tipoMulta" required>
                  <option value="">Seleccione tipo</option>
                  <option value="multa_barra">MULTA A LA BARRA</option>
                  <option value="no_presentacion">NO PRESENTACIÓN</option>
                  <option value="no_vocal">NO VOCAL</option>
                  <option value="no_veedor">NO VEEDOR</option>
                </select>
              </div>
              <div class="mb-4">
                <label class="form-label">ARTÍCULO</label>
                <select class="select-premium" id="multaArticulo" onchange="actualizarLiteralesMulta()">
                  <option value="131">Art. 131 - Multas</option>
                </select>
              </div>
              <div class="mb-4">
                <label class="form-label">LITERAL</label>
                <select class="select-premium" id="multaLiteral">
                  <option value="">Seleccione primero un tipo de multa</option>
                </select>
              </div>
            </form>
          </div>
          <div class="modal-footer border-0">
            <button type="button" class="btn btn-secondary-glass" data-bs-dismiss="modal">CANCELAR</button>
            <button type="button" class="btn btn-danger" onclick="aplicarMulta()">CONFIRMAR MULTA</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap y Firebase -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-auth.js"></script>

    <script>
      // Configuración de Firebase
      const firebaseConfig = {
        apiKey: "AIzaSyAzRTlx96sL8rxcgLauftrTWpr5VlwjV00",
        authDomain: "ldbaa-calificaciones.firebaseapp.com",
        projectId: "ldbaa-calificaciones",
        storageBucket: "ldbaa-calificaciones.firebasestorage.app",
        messagingSenderId: "277579489603",
        appId: "1:277579489603:web:bc93c22fea5f5f6b63cff6",
      };

      // Inicializar Firebase
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }

      const db = firebase.firestore();
      const auth = firebase.auth();

      // Variables globales para mantener el estado
      let campeonatoActual = null;
      let equipoActual = null;

      // Cargar campeonatos al iniciar
      auth.onAuthStateChanged((user) => {
        if (!user || user.email !== "sanciones@gmail.com") {
          window.location.href = "login.html";
          return;
        }
        cargarCampeonatos();
      });

      // Cargar campeonatos
      function cargarCampeonatos() {
        const campeonatosSection =
          document.getElementById("campeonatosSection");
        campeonatosSection.innerHTML =
          '<div class="col-12 text-center"><div class="spinner-border text-success" role="status"></div></div>';

        db.collection("championships")
          .get()
          .then((snapshot) => {
            campeonatosSection.innerHTML = "";
            if (snapshot.empty) {
              campeonatosSection.innerHTML =
                '<div class="col-12 text-center">No hay campeonatos activos</div>';
              return;
            }

            snapshot.forEach((doc) => {
              const campeonato = doc.data();
              const card = `
                            <div class="col-md-4 mb-4">
                                <div class="campeonato-card h-100" onclick="mostrarEquipos('${doc.id}', '${campeonato.name}')">
                                    <img src="img/logo.png" alt="Logo Liga Barrial">
                                    <h4>${campeonato.name}</h4>
                                    <button class="btn btn-premium btn-sm w-100 justify-content-center">
                                        <i class="fas fa-sign-in-alt me-2"></i>Ingresar
                                    </button>
                                </div>
                            </div>
                        `;
              campeonatosSection.insertAdjacentHTML("beforeend", card);
            });
          })
          .catch((error) => {
            console.error("Error al cargar campeonatos:", error);
            campeonatosSection.innerHTML =
              '<div class="col-12 text-center text-danger">Error al cargar los campeonatos</div>';
          });
      }

      // Mostrar equipos de un campeonato
      function mostrarEquipos(campeonatoId, campeonatoNombre) {
        campeonatoActual = campeonatoId;
        document.getElementById("campeonatosSection").style.display = "none";
        document.getElementById("equiposSection").style.display = "block";
        document.getElementById("jugadoresSection").style.display = "none";
        document.getElementById("equiposTitulo").textContent =
          `Equipos - ${campeonatoNombre}`;

        const equiposLista = document.getElementById("equiposLista");
        equiposLista.innerHTML =
          '<div class="col-12 text-center"><div class="spinner-border text-success" role="status"></div></div>';

        db.collection("teams")
          .where("championshipId", "==", campeonatoId)
          .get()
          .then((snapshot) => {
            equiposLista.innerHTML = "";
            if (snapshot.empty) {
              equiposLista.innerHTML =
                '<div class="col-12 text-center">No hay equipos registrados</div>';
              return;
            }

            snapshot.forEach((doc) => {
              const equipo = doc.data();
              const card = `
                            <div class="col-md-4 mb-4">
                                <div class="equipo-card h-100">
                                    <img src="${equipo.logo ? equipo.logo : "img/logo.png"}" alt="Logo Equipo">
                                    <h4>${equipo.name}</h4>
                                    <div class="badge bg-secondary-glass mb-4 text-uppercase fw-bold" style="font-size: 0.75rem;">
                                        ${equipo.category}
                                    </div>
                                    <div class="d-flex flex-column gap-2 mt-auto">
                                        <button class="btn btn-premium btn-sm w-100 justify-content-center" onclick="mostrarJugadores('${doc.id}', '${equipo.name}')">
                                            <i class="fas fa-gavel me-2"></i>Sancionar Jugadores
                                        </button>
                                        <div class="d-flex gap-2">
                                            <button class="btn btn-secondary-glass btn-sm flex-grow-1" onclick="abrirModalMulta('${doc.id}', '${equipo.name}')" title="Aplicar Multa">
                                                <i class="fas fa-dollar-sign me-1 text-danger"></i>Multa
                                            </button>
                                            <button class="btn btn-secondary-glass btn-sm flex-grow-1" onclick="verMultasEquipo('${doc.id}', '${equipo.name}')" title="Ver Historial">
                                                <i class="fas fa-list me-1 text-info"></i>Ver
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
              equiposLista.insertAdjacentHTML("beforeend", card);
            });
            filtrarEquipos();
          })
          .catch((error) => {
            console.error("Error al cargar equipos:", error);
            equiposLista.innerHTML =
              '<div class="col-12 text-center text-danger">Error al cargar los equipos</div>';
          });
      }

      // Mostrar jugadores de un equipo
      function mostrarJugadores(equipoId, equipoNombre) {
        equipoActual = equipoId;
        document.getElementById("equiposSection").style.display = "none";
        document.getElementById("jugadoresSection").style.display = "block";
        document.getElementById("jugadoresTitulo").textContent =
          `Jugadores - ${equipoNombre}`;

        const tbody = document.getElementById("jugadoresTableBody");
        tbody.innerHTML =
          '<tr><td colspan="4" class="text-center"><div class="spinner-border text-success" role="status"></div></td></tr>';

        db.collection("players")
          .where("teamId", "==", equipoId)
          .get()
          .then(async (snapshot) => {
            tbody.innerHTML = "";
            if (snapshot.empty) {
              tbody.innerHTML =
                '<tr><td colspan="4" class="text-center">No hay jugadores registrados</td></tr>';
              return;
            }

            for (const doc of snapshot.docs) {
              const jugador = doc.data();
              const sancionesSnapshot = await db
                .collection("sanciones")
                .where("jugadorId", "==", doc.id)
                .where("estado", "==", "activa")
                .get();

              let tarjetasAmarillas = 0;
              let tarjetasRojas = 0;
              let sancionesActivas = [];

              const hoy = new Date();
              sancionesSnapshot.forEach((sancion) => {
                const data = sancion.data();
                if (data.tipo === "amarilla") {
                  const fechaFinal = data.fechaFinal ? data.fechaFinal.toDate() : null;
                  if (fechaFinal && hoy > fechaFinal) {
                    db.collection("sanciones").doc(sancion.id).update({ estado: "expirada" });
                  } else {
                    tarjetasAmarillas++;
                  }

                } else if (data.tipo === "roja") {
                  tarjetasRojas++;
                  sancionesActivas.push(
                    `Art. ${data.articulo} Lit. ${data.literal}`,
                  );
                }
              });

              // Obtener solo el primer nombre y el primer apellido
              const primerNombre = jugador.nombres
                ? jugador.nombres.split(" ")[0]
                : "";
              const primerApellido = jugador.apellidos
                ? jugador.apellidos.split(" ")[0]
                : "";

              const row = `
                            <tr>
                                <td class="ps-4 fw-bold text-white-50">${jugador.numeroJugador ? jugador.numeroJugador : "—"}</td>
                                <td class="fw-bold text-white">${primerNombre} ${primerApellido}</td>
                                <td class="text-center">
                                    <div class="d-flex flex-wrap justify-content-center gap-2">
                                        <div class="badge bg-warning text-dark d-flex align-items-center px-3 py-2 gap-2" style="cursor: pointer; border-radius: 10px;" onclick="mostrarDetallesSancion('${doc.id}', 'amarilla', ${tarjetasAmarillas})">
                                            <span class="fw-bold">${tarjetasAmarillas}</span>
                                            <i class="fas fa-square" style="transform: scale(1.2);"></i>
                                        </div>
                                        <div class="badge bg-danger d-flex align-items-center px-3 py-2 gap-2" style="cursor: pointer; border-radius: 10px;" onclick="mostrarDetallesSancion('${doc.id}', 'roja', ${tarjetasRojas})">
                                            <span class="fw-bold">${tarjetasRojas}</span>
                                            <i class="fas fa-square" style="transform: scale(1.2);"></i>
                                        </div>
                                    </div>
                                </td>
                                <td class="small text-white-50">${sancionesActivas.join(", ") || "Sin sanciones"}</td>
                                <td class="text-center pe-4">
                                    <button class="btn btn-secondary-glass btn-sm" onclick="abrirModalSancion('${doc.id}')" title="Aplicar Sanción">
                                        <i class="fas fa-gavel text-warning me-1"></i> Sancionar
                                    </button>
                                </td>
                            </tr>
                        `;
              tbody.insertAdjacentHTML("beforeend", row);
            }
            filtrarJugadores();
          })
          .catch((error) => {
            console.error("Error al cargar jugadores:", error);
            tbody.innerHTML =
              '<tr><td colspan="4" class="text-center text-danger">Error al cargar los jugadores</td></tr>';
          });
      }

      // Funciones de navegación
      function volverACampeonatos() {
        document.getElementById("campeonatosSection").style.display = "block";
        document.getElementById("equiposSection").style.display = "none";
        document.getElementById("jugadoresSection").style.display = "none";
        campeonatoActual = null;
        equipoActual = null;
      }

      function volverAEquipos() {
        if (campeonatoActual) {
          mostrarEquipos(
            campeonatoActual,
            document
              .getElementById("equiposTitulo")
              .textContent.replace("Equipos - ", ""),
          );
        }
      }

      // Actualizar literales según artículo
      function actualizarLiterales() {
        const articulo = document.getElementById("articulo").value;
        const literalSelect = document.getElementById("literal");
        literalSelect.innerHTML =
          '<option value="">Seleccione un literal</option>';

        const literales = {
          124: {
            a: "Acumular cuatro tarjetas amarillas",
            b: "Acumular dos tarjetas amarillas y ser expulsado",
            c: "Lanzar la camiseta al piso antes de terminar el encuentro",
            d: "Sacarse la camiseta dentro del campo de juego",
            e: "Ser excluido por aliento a licor o estado etílico",
            f: "Acumulación de 5 tarjetas amarillas",
          },
          125: {
            a: "Realizar necesidades biológicas dentro del perímetro de la cancha",
            b: "Juego Brusco (J.B.) golpear a un rival en disputa del balón",
            c: "Provocar a las barras con palabras soeces o mímicas obscenas",
            d: "Lanzar el balón sin estar en juego",
            e: "Suplantar identidad",
            f: "Jugar estando suspendido",
            g: "Rayar o escribir en la vocalía de Juego",
            h: "Insultar después de expulsado",
          },
          126: {
            a: "Juego Brusco Grave (J.B.G.)",
            b: "Insultar a vocales, veedores o jueces",
            c: "Lanzar el balón e impactar en alguien por la espalda",
            d: "Reincidencia",
          },
          127: {
            a: "Mímicas o gestos obscenos",
            b: "Conducta Violenta (C.V.)",
            c: "Reincidencia",
          },
          128: {
            a: "Epítetos de racismo o escupitajo",
            b: "Intento de agresión a árbitro, vocal o veedor",
            c: "Reincidencia",
          },
          129: {
            a: "Lanzar balón e impactar en rostro causando lesión",
            b: "Lanzar tierra e impactar de frente",
            c: "Conducta violenta que cause daño o lesión",
            d: "Adulterar documentos",
            e: "Suplantación de identidad (dirigente)",
            f: "Escupitajo de frente",
            g: "Intentar agredir a Directivos",
            h: "Agresión consumada",
            i: "Incitar a la agresión",
            k: "Jugador condicionado con pérdida de garantía",
            l: "Jugadores condicionados suspendidos",
            m: "Participación en múltiples ligas",
          },
        };

        if (literales[articulo]) {
          Object.entries(literales[articulo]).forEach(([key, value]) => {
            const option = document.createElement("option");
            option.value = key;
            option.textContent = `${key}) ${value}`;
            literalSelect.appendChild(option);
          });
        }
      }

      // Mostrar/ocultar campos de artículo y literal
      document
        .getElementById("tipoSancion")
        .addEventListener("change", function () {
          const articuloLiteralContainer = document.getElementById(
            "articuloLiteralContainer",
          );
          articuloLiteralContainer.style.display =
            this.value === "roja" ? "block" : "none";
          if (this.value === "roja") {
            document.getElementById("articulo").value = "";
            document.getElementById("literal").innerHTML =
              '<option value="">Seleccione primero un artículo</option>';
          }
        });

      // Función para abrir modal de sanción
      function abrirModalSancion(jugadorId) {
        document.getElementById("jugadorId").value = jugadorId;
        document.getElementById("tipoSancion").value = "";
        document.getElementById("articuloLiteralContainer").style.display =
          "none";
        var articulo = document.getElementById("articulo");
        var literal = document.getElementById("literal");
        if (articulo) articulo.value = "";
        if (literal)
          literal.innerHTML =
            '<option value="">Seleccione primero un artículo</option>';
        const modal = new bootstrap.Modal(
          document.getElementById("sancionModal"),
        );
        modal.show();
      }

      // Función para obtener el próximo martes
      function obtenerProximoTuesday() {
        const hoy = new Date();
        const diasHastaMartes = (2 - hoy.getDay() + 7) % 7;
        const proximoTuesday = new Date(hoy);
        proximoTuesday.setDate(hoy.getDate() + diasHastaMartes);
        proximoTuesday.setHours(0, 0, 0, 0);
        return proximoTuesday;
      }

      // Función para obtener la fecha final de sanción
      function obtenerFechaFinalSancion(partidosSancion) {
        const fechaInicio = obtenerProximoTuesday();
        const fechaFinal = new Date(fechaInicio);
        fechaFinal.setDate(fechaInicio.getDate() + partidosSancion * 7);

      // Modifico aplicarSancion para soportar edición y recargar solo la sección
      function aplicarSancion() {
        const jugadorId = document.getElementById("jugadorId").value;
        const tipo = document.getElementById("tipoSancion").value;
        const articulo = document.getElementById("articulo").value;
        const literal = document.getElementById("literal").value;
        const editId = document
          .getElementById("sancionModal")
          .getAttribute("data-edit-id");

        if (!tipo) {
          Swal.fire("Error", "Seleccione el tipo de sanción", "error");
          return;
        }

        if (tipo === "roja" && (!articulo || !literal)) {
          Swal.fire("Error", "Seleccione artículo y literal", "error");
          return;
        }

        const fechaInicio = obtenerProximoTuesday();
        const partidosSancion =
          tipo === "roja"
            ? {
                124: 1,
                125: 2,
                126: 3,
                127: 4,
                128: 6,
                129: 52,
              }[articulo] || 0
            : 1;

        const fechaFinal = obtenerFechaFinalSancion(partidosSancion);

        const sancion = {
          jugadorId,
          tipo,
          fechaInicio: firebase.firestore.Timestamp.fromDate(fechaInicio),
          fechaFinal: firebase.firestore.Timestamp.fromDate(fechaFinal),
          partidosSancion,
          fecha: firebase.firestore.Timestamp.now(),
          estado: "activa",
          campeonatoId: campeonatoActual,
          equipoId: equipoActual,
        };

        if (tipo === "roja") {
          sancion.articulo = articulo;
          sancion.literal = literal;
        }

        const modalElement = document.getElementById("sancionModal");
        if (editId) {
          db.collection("sanciones")
            .doc(editId)
            .update(sancion)
            .then(() => {
              Swal.fire({
                title: "Éxito",
                text: "Sanción editada correctamente",
                icon: "success",
              }).then(() => {
                mostrarJugadores(
                  equipoActual,
                  document
                    .getElementById("jugadoresTitulo")
                    .textContent.replace("Jugadores - ", ""),
                );
              });
              modalElement.removeAttribute("data-edit-id");
              bootstrap.Modal.getInstance(modalElement).hide();
            });
        } else {
          db.collection("sanciones")
            .add(sancion)
            .then(async () => {
              // Si es amarilla, verificar acumulacion de 5
              if (tipo === "amarilla") {
                const snap = await db.collection("sanciones")
                  .where("jugadorId", "==", jugadorId)
                  .where("tipo", "==", "amarilla")
                  .where("estado", "==", "activa")
                  .get();
                
                if (snap.size >= 5) {
                  Swal.fire({
                    title: "SUSPENSIÓN AUTOMÁTICA",
                    text: "El jugador ha acumulado 5 tarjetas amarillas. Recibe 1 fecha de suspensión automática y el contador se reiniciará al finalizar la misma.",
                    icon: "warning",
                    confirmButtonText: "Entendido",
                    customClass: { popup: "glass-popup" }
                  });
                } else {
                  Swal.fire("Éxito", "Tarjeta aplicada correctamente", "success");
                }
              } else {
                Swal.fire("Éxito", "Sanción aplicada correctamente", "success");
              }
              mostrarJugadores(equipoActual, document.getElementById("jugadoresTitulo").textContent.replace("Jugadores - ", ""));
              bootstrap.Modal.getInstance(modalElement).hide();
            })
            .catch((error) => {
              console.error("Error al aplicar sanción:", error);
              Swal.fire("Error", "No se pudo aplicar la sanción", "error");
            });
        }
      }

          "Total de tarjetas de equipo encontradas:",
          teamCards.length,

        teamCards.forEach((card) => {

          const teamCategoryElement = card.querySelector(".badge");

            );
          }
        });
        console.log("-------------------------");

        console.log("Texto de búsqueda (jugadores):", searchText);

        rows.forEach((row) => {

          const playerNumber = row.cells[0]
            ? row.cells[0].textContent.toLowerCase().trim()

            .then(() => {
              Swal.fire({
                title: "Éxito",
                text: `Multa aplicada correctamente\nMonto: $${montoMulta}`,
                icon: "success",
              }).then(() => {
                mostrarEquipos(
                  campeonatoActual,
                  document
                    .getElementById("equiposTitulo")
                    .textContent.replace("Equipos - ", ""),
                );
              });
              bootstrap.Modal.getInstance(modalElement).hide();
            })
            .catch((error) => {
              console.error("Error al aplicar multa:", error);
              Swal.fire("Error", "No se pudo aplicar la multa", "error");
            });
        }
      }
    </script>
  </body>
</html>
