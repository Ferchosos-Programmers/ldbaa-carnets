    <!-- Modal para crear campeonato -->
    <div
      class="modal fade"
      id="addChampionshipModal"
      tabindex="-1"
      aria-labelledby="addChampionshipModalLabel"
      aria-hidden="true"

      <div class="modal-dialog">
        <div class="modal-content shadow">
          <form id="championshipForm">
            <div class="modal-header">
              <h5 class="modal-title" id="addChampionshipModalLabel">
                <i class="fas fa-plus-circle me-2 brand-accent"></i>Crear Nuevo
                Campeonato
              </h5>
              <button
                type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
                aria-label="Cerrar"
              ></button>
            </div>
            <div class="modal-body p-4">
              <div class="mb-3">
                <label for="championshipName" class="form-label"

                <input

              <div class="mb-3">

              <div class="mb-3">
                <label for="championshipDescription" class="form-label"

                <textarea
                  class="glass-input"
                  id="championshipDescription"
                  rows="3"
                ></textarea>
              </div>
              <div class="mb-3">
                <label for="championshipDeadline" class="form-label"
                  >Fecha Límite Carnetización</label
                >
                <input
                  type="datetime-local"
                  class="glass-input"
                  id="championshipDeadline"
                />
              </div>
              <div class="mb-3">
                <label for="championshipCountdownMessage" class="form-label"
                  >Mensaje Cuenta Regresiva</label
                >
                <textarea
                  class="glass-input"
                  id="championshipCountdownMessage"
                  rows="2"
                  placeholder="Ej: Tienes hasta el [fecha] para completar la carnetización."
                ></textarea>
              </div>
              <div class="mb-3">
                <label for="championshipExpiredMessage" class="form-label"

                >

                  class="glass-input"
                  id="championshipExpiredMessage"

    <!-- Modal para editar campeonato -->

                  max="2100"

              <div class="mb-3">
                <label for="editChampionshipDescription" class="form-label"

                >
                <textarea
                  class="glass-input"
                  id="editChampionshipDescription"
                  rows="3"
                ></textarea>
              </div>
              <div class="mb-3">
                <label for="editChampionshipDeadline" class="form-label"

                >
                <input
                  type="datetime-local"
                  class="glass-input"
                  id="editChampionshipDeadline"

              </div>
              <div class="mb-3">
                <label for="editChampionshipCountdownMessage" class="form-label"
                  >Mensaje Cuenta Regresiva</label
                >
                <textarea
                  class="glass-input"
                  id="editChampionshipCountdownMessage"
                  rows="2"
                  placeholder="Ej: Tienes hasta el [fecha] para completar la carnetización."
                ></textarea>
              </div>
              <div class="mb-3">
                <label for="editChampionshipExpiredMessage" class="form-label"
                  >Mensaje de Expiración</label
                >
                <textarea

                ></textarea>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // Configuración de Firebase
      const firebaseConfig = {
        apiKey: "AIzaSyAzRTlx96sL8rxcgLauftrTWpr5VlwjV00",
        authDomain: "ldbaa-calificaciones.firebaseapp.com",
        projectId: "ldbaa-calificaciones",
        storageBucket: "ldbaa-calificaciones.firebasestorage.app",
        messagingSenderId: "277579489603",
        appId: "1:277579489603:web:bc93c22fea5f5f6b63cff6",
      };

      // Inicializar Firebase
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }

      const db = firebase.firestore();
      const auth = firebase.auth();

      // Configurar Firestore
      db.settings({
        cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED,
      });

      // Habilitar persistencia offline
      db.enablePersistence().catch((err) => {
        if (err.code == "failed-precondition") {
          console.warn("La persistencia falló: múltiples pestañas abiertas");
        } else if (err.code == "unimplemented") {
          console.warn("El navegador no soporta persistencia");
        }
      });

      // Verificar estado de autenticación
      auth.onAuthStateChanged((user) => {
        if (!user) {
          console.log("Usuario no autenticado, redirigiendo...");
          window.location.href = "login.html";
          return;
        }
        console.log("Usuario autenticado:", user.email);

        // Verificar si el usuario es de sanciones
        if (user.email === "sanciones@gmail.com") {
          // Redirigir a la sección de sanciones
          window.location.href = "sanciones.html";
          return;
        }

        loadInitialAndChampionships(); // Cargar campeonatos y asegurar Renacer 2025
      });

      function setupRealtimeUpdates() {
        console.log("Configurando actualizaciones en tiempo real...");
        // Escuchar cambios en la colección teams
        db.collection("teams").onSnapshot(
          (snapshot) => {
            teamCardsContainer.innerHTML = ""; // Limpiar contenedor
            if (snapshot.empty) {
              teamCardsContainer.innerHTML =
                '<div class="col-12 text-center"><p>No hay equipos registrados</p></div>';
            } else {
              snapshot.forEach((doc) => {
                const teamData = doc.data();
                teamData.id = doc.id; // Agregar el ID del documento
                createTeamCard(teamData);
              });
            }
          },
          (error) => {
            console.error("Error al escuchar cambios:", error);
            Swal.fire(
              "Error",
              "Error al actualizar los equipos en tiempo real",
              "error",
            );
          },
        );
      }

      function loadTeams() {
        console.log("Iniciando carga de equipos...");
        db.collection("teams")
          .get()
          .then((querySnapshot) => {
            console.log("Equipos cargados exitosamente");
            teamCardsContainer.innerHTML = ""; // Limpiar contenedor
            if (querySnapshot.empty) {
              teamCardsContainer.innerHTML =
                '<div class="col-12 text-center"><p>No hay equipos registrados</p></div>';
            } else {
              querySnapshot.forEach((doc) => {
                const teamData = doc.data();
                teamData.id = doc.id; // Agregar el ID del documento
                createTeamCard(teamData);
              });
            }
          })
          .catch((error) => {
            console.error("Error al cargar equipos:", error);
            let mensaje = "Error al cargar los equipos. ";
            if (error.code === "permission-denied") {
              mensaje += "No tienes permisos para ver los equipos.";
            } else if (error.code === "unavailable") {
              mensaje += "El servicio no está disponible en este momento.";
            } else {
              mensaje += "Por favor, intenta de nuevo.";
            }
            Swal.fire("Error", mensaje, "error");
          });
      }

      function createTeamCard(team) {
        const card = document.createElement("div");
        card.className = "col-md-4 mb-4";
        card.innerHTML = `
        <div class="glass-card">
          <img src="${team.logo}" class="mb-3" alt="Logo" style="height: 120px; object-fit: contain;">
          <h5 class="fw-bold mb-2">${team.name}</h5>
          <p class="text-white-50 small mb-4">Categoría: ${team.category}</p>
          <div class="d-grid gap-2 w-100">
            <button class="btn btn-secondary-glass btn-sm" onclick="gestionarArchivos('${team.id}', '${team.name}')">
              <i class="fas fa-file-alt"></i> Archivos
            </button>
            <div class="d-flex gap-2">
              <button class="btn btn-outline-warning border-0 flex-grow-1" style="background: rgba(243, 156, 18, 0.1);" onclick="resetAdminKey('${team.id}')">
                <i class="fas fa-key"></i>
              </button>
              <button class="btn btn-outline-danger border-0 flex-grow-1" style="background: rgba(231, 76, 60, 0.1);" onclick="deleteTeam('${team.id}')">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
        </div>
      `;
        document.getElementById("championshipCardsContainer").appendChild(card);
      }

      function deleteTeam(teamId) {
        Swal.fire({
          title: "¿Estás seguro?",
          text: "Este equipo será eliminado permanentemente.",
          icon: "warning",
          showCancelButton: true,
          confirmButtonText: "Sí, eliminar",
          cancelButtonText: "Cancelar",
        }).then((result) => {
          if (result.isConfirmed) {
            db.collection("teams")
              .doc(teamId)
              .delete()
              .then(() => {
                Swal.fire({
                  title: "Eliminado",
                  text: "El equipo ha sido eliminado.",
                  icon: "success",
                }).then(() => {
                  location.reload();
                });
              })
              .catch((error) => {
                console.error("Error al eliminar equipo:", error);
                Swal.fire(
                  "Error",
                  "No se pudo eliminar el equipo. Por favor, intenta de nuevo.",
                  "error",
                );
              });
          }
        });
      }

      // Función para resetear la clave de administrador
      function resetAdminKey(teamId) {
        Swal.fire({
          title: "¿Resetear la clave?",
          text: "Se eliminará la clave actual y se deberá establecer una nueva la próxima vez que se acceda al registro de jugadores.",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#28a745",
          cancelButtonColor: "#d33",
          confirmButtonText: "Sí, resetear",
          cancelButtonText: "Cancelar",
        }).then((result) => {
          if (result.isConfirmed) {
            db.collection("teams")
              .doc(teamId)
              .update({
                adminKey: null,
              })
              .then(() => {
                Swal.fire({
                  title: "¡Clave reseteada!",
                  text: "La clave ha sido eliminada. Se solicitará una nueva clave la próxima vez que se acceda al registro de jugadores.",
                  icon: "success",
                });
              })
              .catch((error) => {
                console.error("Error al resetear la clave:", error);
                Swal.fire(
                  "Error",
                  "No se pudo resetear la clave. Por favor, intenta de nuevo.",
                  "error",
                );
              });
          }
        });
      }

      // Función para cerrar sesión con SweetAlert2
      function logout() {
        Swal.fire({
          title: "¿Cerrar sesión?",
          text: "¿Estás seguro de que deseas salir?",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#28a745",
          cancelButtonColor: "#d33",
          confirmButtonText: "Sí, salir",
          cancelButtonText: "Cancelar",
        }).then((result) => {
          if (result.isConfirmed) {
            auth
              .signOut()
              .then(() => {
                Swal.fire({
                  title: "¡Sesión cerrada!",
                  text: "Has cerrado sesión correctamente.",
                  icon: "success",
                }).then(() => {
                  window.location.href = "login.html";
                });
              })
              .catch((error) => {
                console.error("Error al cerrar sesión:", error);
                Swal.fire(
                  "Error",
                  "No se pudo cerrar la sesión. Por favor, intenta de nuevo.",
                  "error",
                );
              });
          }
        });
      }

      // Función para gestionar archivos
      function gestionarArchivos(teamId, teamName) {
        // Verificar si el usuario es admin
        auth.onAuthStateChanged((user) => {
          if (user && user.email === "admin@gmail.com") {
            document.getElementById("teamIdArchivos").value = teamId;
            document.getElementById("modalGestionarArchivosLabel").textContent =
              `Gestionar Archivos - ${teamName}`;
            cargarArchivos(teamId);
            const modal = new bootstrap.Modal(
              document.getElementById("modalGestionarArchivos"),
            );
            modal.show();
          } else {
            Swal.fire(
              "Error",
              "No tienes permisos para gestionar archivos",
              "error",
            );
          }
        });
      }

      // Función para cargar los archivos existentes
      function cargarArchivos(teamId) {
        const listaArchivos = document.getElementById("listaArchivos");
        listaArchivos.innerHTML =
          '<div class="text-center"><div class="spinner-border text-info" role="status"></div></div>';

        db.collection("archivos")
          .where("teamId", "==", teamId)
          .get()
          .then((querySnapshot) => {
            listaArchivos.innerHTML = "";
            if (querySnapshot.empty) {
              listaArchivos.innerHTML =
                '<p class="text-center text-muted">No hay archivos subidos</p>';
              return;
            }

            querySnapshot.forEach((doc) => {
              const archivo = doc.data();
              const item = document.createElement("div");
              item.className =
                "list-group-item d-flex justify-content-between align-items-center";
              item.innerHTML = `
                <div>
                  <i class="fas fa-file-pdf text-danger me-2"></i>
                  ${
                    archivo.tipo === "CARTA_PASE"
                      ? "Carta Pase"
                      : "Autorización"
                  }
                </div>
                <div>
                  <a href="${
                    archivo.url
                  }" target="_blank" class="btn btn-sm btn-info me-2">
                    <i class="fas fa-eye"></i>
                  </a>
                  <button onclick="eliminarArchivo('${
                    doc.id
                  }')" class="btn btn-sm btn-danger">
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
              `;
              listaArchivos.appendChild(item);
            });
          })
          .catch((error) => {
            console.error("Error al cargar archivos:", error);
            listaArchivos.innerHTML =
              '<p class="text-center text-danger">Error al cargar los archivos</p>';
          });
      }

      // Función para crear o asegurar el campeonato Renacer 2025 y asignar equipos
      async function ensureRenacer2025AndAssignTeams() {
        // Buscar si existe el campeonato Renacer 2025
        let renacerId = null;
        const renacerQuery = await db
          .collection("championships")
          .where("name", "==", "Renacer 2025")
          .limit(1)
          .get();
        if (!renacerQuery.empty) {
          renacerId = renacerQuery.docs[0].id;
        } else {
          // Crear el campeonato si no existe
          const renacerDoc = await db.collection("championships").add({
            name: "Renacer 2025",
            year: 2025,
            description: "Campeonato principal de la temporada 2025",
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          });
          renacerId = renacerDoc.id;
        }

        // Asignar todos los equipos existentes a este campeonato si no tienen championshipId
        const teamsSnapshot = await db.collection("teams").get();
        const batch = db.batch();
        teamsSnapshot.forEach((doc) => {
          const data = doc.data();
          if (!data.championshipId || data.championshipId !== renacerId) {
            batch.update(db.collection("teams").doc(doc.id), {
              championshipId: renacerId,
            });
          }
        });
        if (!teamsSnapshot.empty) {
          await batch.commit();
        }
      }

      // Modificar la carga inicial para asegurar el campeonato y equipos
      async function loadInitialAndChampionships() {
        await ensureRenacer2025AndAssignTeams();
        loadChampionships();
      }

      // Función para cargar campeonatos
      function loadChampionships() {
        const container = document.getElementById("championshipCardsContainer");
        container.innerHTML =
          '<div class="col-12 text-center"><div class="spinner-border text-success" role="status"></div></div>';

        db.collection("championships")
          .get()
          .then((querySnapshot) => {
            container.innerHTML = "";
            if (querySnapshot.empty) {
              container.innerHTML =
                '<div class="col-12 text-center"><p>No hay campeonatos registrados</p></div>';
              return;
            }

            querySnapshot.forEach((doc) => {
              const championship = doc.data();
              createChampionshipCard(doc.id, championship);
            });
          })
          .catch((error) => {
            console.error("Error al cargar campeonatos:", error);
            Swal.fire(
              "Error",
              "No se pudieron cargar los campeonatos",
              "error",
            );
          });
      }

      // Función para crear tarjeta de campeonato
      function createChampionshipCard(id, championship) {
        const card = document.createElement("div");
        card.className = "col-md-4 mb-4";
        card.innerHTML = `
          <div class="glass-card">
            <div class="text-center w-100">
              <div class="mb-4">
                <i class="fas fa-trophy text-warning fa-4x mb-2" style="filter: drop-shadow(0 0 10px rgba(241, 196, 15, 0.3));"></i>
              </div>
              <h3 class="fw-bold mb-2">${championship.name}</h3>
              <p class="text-white-50 mb-4 px-3" style="font-size: 0.95rem;">${championship.description || "Inicia tu gestión en este campeonato."}</p>
              
              <div class="d-grid gap-3 w-100 mt-2">
                <a href="championship-teams.html?id=${id}" class="btn-premium justify-content-center py-3">
                  <i class="fas fa-sign-in-alt me-2"></i> ENTRAR AL PANEL
                </a>
                <div class="d-flex gap-2">
                  <button class="btn btn-secondary-glass flex-grow-1" onclick="editChampionship('${id}')">
                    <i class="fas fa-cog me-1"></i> Configurar
                  </button>
                  <button class="btn btn-outline-danger border-0 flex-shrink-0 px-3" style="background: rgba(231, 76, 60, 0.1);" onclick="deleteChampionship('${id}')">
                    <i class="fas fa-trash-alt"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
        document.getElementById("championshipCardsContainer").appendChild(card);
      }

      // Manejar el envío del formulario de campeonato
      document
        .getElementById("championshipForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const deadline = document.getElementById(
            "championshipDeadline",
          ).value;

          const championshipData = {
            name: document.getElementById("championshipName").value,
            year: parseInt(document.getElementById("championshipYear").value),
            description: document.getElementById("championshipDescription")
              .value,
            deadline: deadline || null, // Guardar como cadena ISO 8601
            countdownMessage:
              document.getElementById("championshipCountdownMessage").value ||
              null,
            expiredMessage:
              document.getElementById("championshipExpiredMessage").value ||
              null,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          };

          // Si hay fecha de deadline, establecerla como fecha de inicio de notificaciones
          if (deadline) {
            championshipData.notificationStartDate = deadline;
            championshipData.deadlineLastChanged =
              firebase.firestore.FieldValue.serverTimestamp();
          }

          db.collection("championships")
            .add(championshipData)
            .then(() => {
              Swal.fire({
                title: "Éxito",
                text: "Campeonato creado correctamente",
                icon: "success",
              });
              document.getElementById("championshipForm").reset();
              const modal = bootstrap.Modal.getInstance(
                document.getElementById("addChampionshipModal"),
              );
              modal.hide();
              loadChampionships();
            })
            .catch((error) => {
              console.error("Error al crear campeonato:", error);
              Swal.fire("Error", "No se pudo crear el campeonato", "error");
            });
        });

      // Función para editar campeonato
      async function editChampionship(id) {
        try {
          const doc = await db.collection("championships").doc(id).get();
          if (!doc.exists) {
            Swal.fire("Error", "Campeonato no encontrado", "error");
            return;
          }

          const championship = doc.data();
          document.getElementById("editChampionshipId").value = id;
          document.getElementById("editChampionshipName").value =
            championship.name;
          document.getElementById("editChampionshipYear").value =
            championship.year;
          document.getElementById("editChampionshipDescription").value =
            championship.description || "";

          // Formatear la fecha para el input datetime-local
          if (championship.deadline) {
            const date = new Date(championship.deadline);
            const formattedDate = date.toISOString().slice(0, 16);
            document.getElementById("editChampionshipDeadline").value =
              formattedDate;
          } else {
            document.getElementById("editChampionshipDeadline").value = "";
          }

          document.getElementById("editChampionshipCountdownMessage").value =
            championship.countdownMessage || "";
          document.getElementById("editChampionshipExpiredMessage").value =
            championship.expiredMessage || "";

          // Guardar la fecha original para comparar si cambió
          window.originalDeadline = championship.deadline;

          const modal = new bootstrap.Modal(
            document.getElementById("editChampionshipModal"),
          );
          modal.show();
        } catch (error) {
          console.error(
            "Error al cargar datos del campeonato para edición:",
            error,
          );
          Swal.fire(
            "Error",
            "No se pudieron cargar los datos del campeonato para edición",
            "error",
          );
        }
      }

      // Manejar el envío del formulario de edición de campeonato
      document
        .getElementById("editChampionshipForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const id = document.getElementById("editChampionshipId").value;
          const newDeadline = document.getElementById(
            "editChampionshipDeadline",
          ).value;
          const originalDeadline = window.originalDeadline;

          const updatedData = {
            name: document.getElementById("editChampionshipName").value,
            year: parseInt(
              document.getElementById("editChampionshipYear").value,
            ),
            description: document.getElementById("editChampionshipDescription")
              .value,
            deadline: newDeadline || null,
            countdownMessage:
              document.getElementById("editChampionshipCountdownMessage")
                .value || null,
            expiredMessage:
              document.getElementById("editChampionshipExpiredMessage").value ||
              null,
          };

          // Verificar si la fecha de deadline cambió
          const deadlineChanged = originalDeadline !== newDeadline;

          if (deadlineChanged && newDeadline) {
            // Si la fecha cambió, establecer la nueva fecha como punto de inicio para notificaciones
            updatedData.notificationStartDate = newDeadline;
            updatedData.deadlineLastChanged =
              firebase.firestore.FieldValue.serverTimestamp();
          }

          db.collection("championships")
            .doc(id)
            .update(updatedData)
            .then(() => {
              let message = "Campeonato actualizado correctamente";
              if (deadlineChanged) {
                message +=
                  ". Las notificaciones de jugadores nuevos comenzarán desde la nueva fecha de finalización.";
              }

              Swal.fire({
                title: "Éxito",
                text: message,
                icon: "success",
              });
              const modal = bootstrap.Modal.getInstance(
                document.getElementById("editChampionshipModal"),
              );
              modal.hide();
              loadChampionships(); // Recargar la lista de campeonatos
            })
            .catch((error) => {
              console.error("Error al actualizar campeonato:", error);
              Swal.fire(
                "Error",
                "No se pudo actualizar el campeonato",
                "error",
              );
            });
        });

      // Función para eliminar campeonato
      function deleteChampionship(id) {
        Swal.fire({
          title: "¿Estás seguro?",
          text: "Este campeonato será eliminado permanentemente",
          icon: "warning",
          showCancelButton: true,
          confirmButtonText: "Sí, eliminar",
          cancelButtonText: "Cancelar",
        }).then((result) => {
          if (result.isConfirmed) {
            db.collection("championships")
              .doc(id)
              .delete()
              .then(() => {
                Swal.fire(
                  "Eliminado",
                  "El campeonato ha sido eliminado",
                  "success",
                );
                loadChampionships();
              })
              .catch((error) => {
                console.error("Error al eliminar campeonato:", error);
                Swal.fire(
                  "Error",
                  "No se pudo eliminar el campeonato",
                  "error",
                );
              });
          }
        });
      }

      // Función para exportar todos los jugadores a Excel
      async function exportarJugadoresExcel() {
        try {
          Swal.fire({
            title: "Preparando exportación...",
            text: "Obteniendo datos de todos los jugadores registrados",
            allowOutsideClick: false,
            didOpen: () => {
              Swal.showLoading();
            },
          });

          // Obtener todos los jugadores
          const snapshot = await db.collection("players").get();

          if (snapshot.empty) {
            Swal.fire(
              "Error",
              "No hay jugadores registrados para exportar",
              "error",
            );
            return;
          }

          const data = [];
          snapshot.forEach((doc) => {
            const player = doc.data();
            data.push({
              Número: player.numeroJugador || "S/N",
              Nombres: player.nombres || "",
              Apellidos: player.apellidos || "",
              Cédula: player.cedula || "",
              "Club/Equipo": player.teamName || "Sin asignar",
            });
          });

          // Crear hoja de Excel
          const ws = XLSX.utils.json_to_sheet(data);

          // Ajustar ancho de columnas automáticamente
          const colWidths = [
            { wch: 10 }, // Número
            { wch: 25 }, // Nombres
            { wch: 25 }, // Apellidos
            { wch: 15 }, // Cédula
            { wch: 30 }, // Club
          ];
          ws["!cols"] = colWidths;

          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, "Jugadores");

          // Nombre del archivo con fecha
          const fecha = new Date().toLocaleDateString().replace(/\//g, "-");
          XLSX.writeFile(wb, `Reporte_Jugadores_${fecha}.xlsx`);

          Swal.fire({
            title: "¡Éxito!",
            text: "El reporte de jugadores ha sido generado correctamente.",
            icon: "success",
          });
        } catch (error) {
          console.error("Error al exportar a Excel:", error);
          Swal.fire({
            title: "Error",
            text: "Ocurrió un error al generar el archivo Excel. Por favor intente de nuevo.",
            icon: "error",
          });
        }
      }
    </script>
  </body>
</html>
