<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pasión Argelia | LDBAA</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

  <link rel="icon" href="img/logo.png" />
  <link rel="stylesheet" href="css/global-theme.css" />
  <link rel="stylesheet" href="css/vocalias.css" />
  <link rel="stylesheet" href="css/tabla-posiciones.css" />

  <style>
    body {
      font-family: 'Times New Roman', Times, serif; /* Mantenemos el estilo editorial */
    }
    
    .goal-badge {
      background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
      color: #fff;
      padding: 5px 12px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
    }
    .player-row:hover {
      background: rgba(255, 255, 255, 0.02) !important;
    }
    .points-cell { font-weight: 900; color: #2ecc71; font-size: 1.1rem; }
  </style>
</head>
<body>
  <div class="main-bg"></div>

  <!-- Navigation exacto a vocalias.html -->
  <nav class="nav-premium shadow-sm">
    <div class="nav-content">
      <a href="index.html" class="nav-logo">
        <img src="img/logo.png" alt="Logo" />
        <span>LDBAA <span class="brand-accent">ARGELIA ALTA</span></span>
      </a>
      <div class="nav-links d-none d-md-flex">
        <a href="index.html"><i class="fas fa-home me-2"></i>Inicio</a>
        <a href="#" class="active"><i class="fas fa-trophy me-2"></i>Pasión Argelia</a>
      </div>
      <a href="index.html" class="btn-logout-premium text-decoration-none">
        <i class="fas fa-chevron-left me-2"></i><span>Volver</span>
      </a>
    </div>
  </nav>

  <div class="container py-5">
    <!-- Encabezado -->
    <div class="text-center mb-5">
      <h2 class="section-title">
        🏆 Pasión <span class="text-warning">Argelia</span>
      </h2>
      <p class="text-white-50">
        Consulta la tabla de posiciones y goleadores oficiales del torneo.
      </p>
    </div>

    <!-- Selector de Campeonato -->
    <div class="glass-panel mb-5">
      <div class="row align-items-center">
        <div class="col-md-4">
          <label class="form-label mb-2 text-white-50">CAMPEONATO ACTIVO</label>
          <select id="campSelect" class="select-premium" onchange="onChampionshipSelected()">
            <option value="">Cargando campeonatos...</option>
          </select>
        </div>
        <div class="col-md-8 text-end">
          <div class="d-flex justify-content-end gap-2">
            <span class="badge bg-success-glass">EN VIVO</span>
            <span class="badge bg-secondary-glass">SOLO LECTURA</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Pestañas de Categoría -->
    <ul class="nav nav-pills nav-pills-premium justify-content-center mb-4" id="categoryTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="maxima-tab" data-bs-toggle="pill" type="button" role="tab">MÁXIMA</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="primera-tab" data-bs-toggle="pill" type="button" role="tab">PRIMERA</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="femenino-tab" data-bs-toggle="pill" type="button" role="tab">FEMENINO</button>
      </li>
    </ul>

    <!-- Pestañas de Estadísticas -->
    <ul class="nav nav-tabs border-0 justify-content-center mb-4" id="statsTabs" role="tablist">
      <li class="nav-item mx-2" role="presentation">
        <button class="btn btn-outline-warning active" id="posiciones-tab" data-bs-toggle="tab" data-bs-target="#posiciones" type="button" role="tab">
          <i class="fa-solid fa-list-ol me-2"></i>Tabla de Posiciones
        </button>
      </li>
      <li class="nav-item mx-2" role="presentation">
        <button class="btn btn-outline-info" id="goleadores-tab" data-bs-toggle="tab" data-bs-target="#goleadores" type="button" role="tab">
          <i class="fa-solid fa-futbol me-2"></i>Goleadores
        </button>
      </li>
    </ul>

    <div class="tab-content" id="statsTabContent">
      <!-- TABLA DE POSICIONES -->
      <div class="tab-pane fade show active" id="posiciones" role="tabpanel">
        <div class="table-premium-container p-0 overflow-hidden">
          <div class="table-responsive">
            <table class="table-premium">
              <thead>
                <tr>
                  <th class="text-center">Pos</th>
                  <th>Equipo</th>
                  <th class="text-center">PJ</th>
                  <th class="text-center">PG</th>
                  <th class="text-center">PE</th>
                  <th class="text-center">PP</th>
                  <th class="text-center">GF</th>
                  <th class="text-center">GC</th>
                  <th class="text-center">GD</th>
                  <th class="text-center">Pts</th>
                </tr>
              </thead>
              <tbody id="posicionesTableBody">
                <tr><td colspan="10" class="text-center py-5 text-white-50">Seleccione un campeonato</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- GOLEADORES -->
      <div class="tab-pane fade" id="goleadores" role="tabpanel">
        <div class="table-premium-container p-0 overflow-hidden">
          <div class="table-responsive">
            <table class="table-premium">
              <thead>
                <tr>
                  <th style="width: 80px">Pos</th>
                  <th class="text-start ps-4">Jugador</th>
                  <th class="text-start ps-4">Equipo</th>
                  <th style="width: 150px">Goles</th>
                </tr>
              </thead>
              <tbody id="goleadoresTableBody">
                <tr><td colspan="4" class="text-center py-5 text-white-50">Seleccione un campeonato</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAzRTlx96sL8rxcgLauftrTWpr5VlwjV00",
      authDomain: "ldbaa-calificaciones.firebaseapp.com",
      projectId: "ldbaa-calificaciones",
      storageBucket: "ldbaa-calificaciones.firebasestorage.app",
      messagingSenderId: "277579489603",
      appId: "1:277579489603:web:bc93c22fea5f5f6b63cff6"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentChampionshipId = null;
    let currentCategory = 'maxima';

    window.addEventListener("DOMContentLoaded", async () => {
      await loadChampionships();
    });

    async function loadChampionships() {
      const select = document.getElementById("campSelect");
      try {
        const snapshot = await db.collection("championships").orderBy("createdAt", "desc").get();
        select.innerHTML = '<option value="">Seleccionar campeonato...</option>';
        if (snapshot.empty) {
          select.innerHTML = '<option value="">No hay campeonatos</option>';
          return;
        }
        snapshot.forEach((doc) => {
          const opt = document.createElement("option");
          opt.value = doc.id;
          opt.textContent = doc.data().name;
          select.appendChild(opt);
        });
        if (select.options.length > 1) {
          select.value = select.options[1].value;
          onChampionshipSelected();
        }
      } catch (e) {
        console.error(e);
      }
    }

    function onChampionshipSelected() {
      const campId = document.getElementById('campSelect').value;
      if (!campId) return;
      currentChampionshipId = campId;
      loadStats();
    }

    // Escuchar cambios en las pestañas de categorías
    document.querySelectorAll('#categoryTabs .nav-link').forEach(tab => {
      tab.addEventListener('click', (e) => {
        // Remover active de todos y poner al actual
        document.querySelectorAll('#categoryTabs .nav-link').forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
        
        currentCategory = e.target.id.replace('-tab', '');
        loadStats();
      });
    });

    async function loadStats() {
      if (!currentChampionshipId) return;
      
      const posTableBody = document.getElementById('posicionesTableBody');
      const golTableBody = document.getElementById('goleadoresTableBody');
      
      posTableBody.innerHTML = '<tr><td colspan="10" class="text-center py-5"><div class="spinner-border text-success"></div><div class="mt-2 text-white-50">Cargando Posiciones...</div></td></tr>';
      golTableBody.innerHTML = '<tr><td colspan="4" class="text-center py-5"><div class="spinner-border text-info"></div><div class="mt-2 text-white-50">Cargando Goleadores...</div></td></tr>';

      try {
        // 1. Obtener equipos
        const teamsSnap = await db.collection('teams').where('championshipId', '==', currentChampionshipId).get();
        let teamsData = {};
        
        const normalizedCat = currentCategory.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

        teamsSnap.forEach(doc => {
          const team = doc.data();
          const teamCat = (team.category || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
          
          if (teamCat === normalizedCat) {
            teamsData[team.name] = {
              name: team.name,
              logo: team.logo || 'img/logo.png',
              pj: 0, pg: 0, pe: 0, pp: 0, gf: 0, gc: 0, dg: 0, pts: 0
            };
          }
        });

        // 2. Obtener fixtures (partidos) para posiciones y goleadores
        const fixturesSnap = await db.collection('fixtures').where('championshipId', '==', currentChampionshipId).get();

        let allGoleadores = {}; // clave: "Jugador|Equipo"

        fixturesSnap.forEach(doc => {
          const fixture = doc.data();
          const fixCat = (fixture.category || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

          if (fixCat === normalizedCat) {
            fixture.data.forEach(m => {
              if (m.isFinalized && teamsData[m.local] && teamsData[m.visitor]) {
                const goalsLocal = (m.playersLocal || []).reduce((acc, p) => acc + (parseInt(p.goles) || 0), 0);
                const goalsVisitor = (m.playersVisitor || []).reduce((acc, p) => acc + (parseInt(p.goles) || 0), 0);

                // Update Posiciones
                teamsData[m.local].pj++;
                teamsData[m.local].gf += goalsLocal;
                teamsData[m.local].gc += goalsVisitor;

                teamsData[m.visitor].pj++;
                teamsData[m.visitor].gf += goalsVisitor;
                teamsData[m.visitor].gc += goalsLocal;

                if (goalsLocal > goalsVisitor) {
                  teamsData[m.local].pg++;
                  teamsData[m.local].pts += 3;
                  teamsData[m.visitor].pp++;
                } else if (goalsLocal < goalsVisitor) {
                  teamsData[m.visitor].pg++;
                  teamsData[m.visitor].pts += 3;
                  teamsData[m.local].pp++;
                } else {
                  teamsData[m.local].pe++;
                  teamsData[m.local].pts += 1;
                  teamsData[m.visitor].pe++;
                  teamsData[m.visitor].pts += 1;
                }

                // Update Goleadores Local
                (m.playersLocal || []).forEach(p => {
                  let goles = parseInt(p.goles) || 0;
                  if(goles > 0 && p.name) {
                    let key = p.name.trim().toUpperCase() + "|" + m.local;
                    if(!allGoleadores[key]) {
                      allGoleadores[key] = { nombre: p.name.trim().toUpperCase(), equipo: m.local, goles: 0 };
                    }
                    allGoleadores[key].goles += goles;
                  }
                });

                // Update Goleadores Visitor
                (m.playersVisitor || []).forEach(p => {
                  let goles = parseInt(p.goles) || 0;
                  if(goles > 0 && p.name) {
                    let key = p.name.trim().toUpperCase() + "|" + m.visitor;
                    if(!allGoleadores[key]) {
                      allGoleadores[key] = { nombre: p.name.trim().toUpperCase(), equipo: m.visitor, goles: 0 };
                    }
                    allGoleadores[key].goles += goles;
                  }
                });
              }
            });
          }
        });

        // 3. Renderizar Tabla de Posiciones
        let sortedTeams = Object.values(teamsData).map(t => {
          t.dg = t.gf - t.gc;
          return t;
        });

        sortedTeams.sort((a, b) => {
          if (b.pts !== a.pts) return b.pts - a.pts;
          if (b.dg !== a.dg) return b.dg - a.dg;
          return b.gf - a.gf;
        });

        if(sortedTeams.length === 0) {
          posTableBody.innerHTML = '<tr><td colspan="10" class="text-center py-4 text-white-50">No hay equipos registrados o partidos finalizados.</td></tr>';
        } else {
          posTableBody.innerHTML = sortedTeams.map((team, index) => {
            let posClass = "";
            if(index === 0) posClass = "pos-1";
            else if(index === 1) posClass = "pos-2";
            else if(index === 2) posClass = "pos-3";

            return `
              <tr>
                <td class="text-center"><span class="position-badge ${posClass}">${index + 1}</span></td>
                <td>
                  <div class="d-flex align-items-center">
                    <img src="${team.logo}" alt="Logo" class="me-2" style="width: 30px; height: 30px; border-radius: 50%; object-fit: cover;">
                    <span class="fw-bold">${team.name}</span>
                  </div>
                </td>
                <td class="text-center">${team.pj}</td>
                <td class="text-center">${team.pg}</td>
                <td class="text-center">${team.pe}</td>
                <td class="text-center">${team.pp}</td>
                <td class="text-center">${team.gf}</td>
                <td class="text-center">${team.gc}</td>
                <td class="text-center fw-bold ${team.dg >= 0 ? 'text-info' : 'text-danger'}">${team.dg > 0 ? '+'+team.dg : team.dg}</td>
                <td class="text-center points-cell">${team.pts}</td>
              </tr>
            `;
          }).join('');
        }

        // 4. Renderizar Goleadores
        let sortedGoleadores = Object.values(allGoleadores).sort((a, b) => b.goles - a.goles);

        if(sortedGoleadores.length === 0) {
          golTableBody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-white-50">No se registraron goles aún.</td></tr>';
        } else {
          golTableBody.innerHTML = sortedGoleadores.map((jugador, index) => {
            return `
              <tr class="player-row">
                <td class="fw-bold fs-5" style="color: #2ecc71">#${index + 1}</td>
                <td class="text-start ps-4">
                  <div class="fw-bold text-white fs-6">${jugador.nombre}</div>
                </td>
                <td class="text-start ps-4">
                  <div class="d-flex align-items-center">
                    <img src="${teamsData[jugador.equipo] ? teamsData[jugador.equipo].logo : 'img/logo.png'}" alt="Team" class="me-2" style="width: 25px; height: 25px; border-radius: 50%; object-fit: cover">
                    <span class="text-white-50 small fw-bold">${jugador.equipo}</span>
                  </div>
                </td>
                <td>
                  <span class="goal-badge">${jugador.goles}</span>
                </td>
              </tr>
            `;
          }).join('');
        }

      } catch (error) {
        console.error("Error al calcular estadísticas:", error);
        posTableBody.innerHTML = '<tr><td colspan="10" class="text-danger text-center">Error al cargar estadísticas.</td></tr>';
        golTableBody.innerHTML = '<tr><td colspan="4" class="text-danger text-center">Error al cargar goleadores.</td></tr>';
      }
    }
  </script>
</body>
</html>
