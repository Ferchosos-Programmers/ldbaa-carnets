<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vocalía Digital | LDBAA</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/global-theme.css" />
    <link rel="stylesheet" href="css/vocalias.css" />

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/global-swal-patch.js"></script>

    <style>
      .jornada-card-elite {
          background: rgba(255, 255, 255, 0.03);
          backdrop-filter: blur(10px);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 20px;
          padding: 30px;
          text-align: center;
          transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
          cursor: pointer;
          position: relative;
          overflow: hidden;
      }
      .jornada-card-elite:hover {
          transform: translateY(-10px);
          background: rgba(46, 204, 113, 0.1);
          border-color: var(--primary-color);
          box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      }
      .jornada-card-elite i {
          font-size: 2.5rem;
          color: var(--primary-color);
          margin-bottom: 15px;
          display: block;
      }
      .jornada-card-elite h5 {
          color: white;
          font-weight: 800;
          margin-bottom: 5px;
          text-transform: uppercase;
          letter-spacing: 1px;
      }
      .jornada-card-elite .match-count {
          font-size: 0.8rem;
          color: rgba(255,255,255,0.5);
          text-transform: uppercase;
      }

      .match-row-elite {
          background: rgba(255, 255, 255, 0.02);
          border-radius: 12px;
          padding: 15px 20px;
          margin-bottom: 10px;
          border-left: 4px solid var(--primary-color);
          transition: 0.3s;
          cursor: pointer;
          border: 1px solid rgba(255,255,255,0.05);
      }
      .match-row-elite:hover {
          background: rgba(255,255,255,0.05);
          transform: translateX(10px);
      }
      .team-label { font-weight: 800; color: white; font-size: 0.95rem; }
      .vs-label { color: var(--primary-color); font-weight: 900; margin: 0 15px; font-size: 0.8rem; }
      .mesa-label { font-size: 0.75rem; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; }
      .mesa-val { font-size: 0.85rem; color: #f1c40f; font-weight: 600; }
      
      .btn-back-jornadas {
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid rgba(255, 255, 255, 0.1);
          color: white;
          padding: 8px 15px;
          border-radius: 10px;
          transition: 0.3s;
      }
      .btn-back-jornadas:hover {
          background: white;
          color: black;
      }
    </style>
  </head>
  <body>
    <div class="main-bg"></div>

    <!-- Navigation -->
    <nav class="nav-premium shadow-sm">
      <div class="nav-content">
        <a href="index.html" class="nav-logo">
          <img src="img/logo.png" alt="Logo" />
          <span>LDBAA <span class="brand-accent">ARGELIA ALTA</span></span>
        </a>
        <div class="nav-links d-none d-md-flex">
          <a href="index.html"><i class="fas fa-home me-2"></i>Inicio</a>
          <a href="#" class="active"><i class="fas fa-file-invoice me-2"></i>Actas Digitales</a>
        </div>
        <a href="index.html" class="btn-logout-premium text-decoration-none">
          <i class="fas fa-chevron-left me-2"></i><span>Volver</span>
        </a>
      </div>
    </nav>

    <div class="container py-5">
      <!-- Encabezado -->
      <div class="text-center mb-5">
        <h2 class="section-title">⚽ Vocalía <span class="text-primary-glow">Digital</span></h2>
        <p class="text-white-50">Selecciona una jornada para gestionar los encuentros programados.</p>
      </div>

      <!-- Selector de Campeonato -->
      <div class="glass-panel mb-5">
        <div class="row align-items-center">
            <div class="col-md-4">
                <label class="form-label mb-2 text-white-50">CAMPEONATO ACTIVO</label>
                <select id="campSelect" class="select-premium" onchange="resetAndLoad()">
                  <option value="">Cargando campeonatos...</option>
                </select>
            </div>
            <div class="col-md-8 text-end">
                <div class="d-flex justify-content-end gap-2">
                    <span class="badge bg-success-glass">EN VIVO</span>
                    <span class="badge bg-secondary-glass">SINCRONIZADO</span>
                </div>
            </div>
        </div>
      </div>

      <!-- Contenedor dinámico -->
      <div id="jornadasContainer" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4 f-view">
        <!-- Tarjetas de Jornadas se cargan aquí -->
      </div>

      <div id="matchesContainer" class="d-none">
          <!-- Lista de partidos se carga aquí -->
      </div>
    </div>

    <!-- Modal de Identificación y Acta (Legado Ajustado) -->
    <div class="modal fade" id="vocaliaModal" tabindex="-1">
      <div class="modal-dialog modal-xl">
        <div class="modal-content modal-premium">
          <div class="modal-header border-0 pb-0">
             <h5 class="modal-title fw-800 text-uppercase" style="letter-spacing:2px">
                <i class="fas fa-microchip me-2 text-primary-glow"></i> ACTA DIGITAL
             </h5>
             <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4" id="modalVocalBody">
              <!-- El contenido del acta se renderiza aquí -->
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-firestore.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyAzRTlx96sL8rxcgLauftrTWpr5VlwjV00",
        authDomain: "ldbaa-calificaciones.firebaseapp.com",
        projectId: "ldbaa-calificaciones",
        storageBucket: "ldbaa-calificaciones.firebasestorage.app",
        messagingSenderId: "277579489603",
        appId: "1:277579489603:web:bc93c22fea5f5f6b63cff6",
      };
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      let fixturesMap = new Map();
      let currentJornada = null;

      window.addEventListener("DOMContentLoaded", async () => {
        await loadChampionships();
      });

      async function loadChampionships() {
        const select = document.getElementById("campSelect");
        try {
          const snapshot = await db.collection("championships").orderBy("createdAt", "desc").get();
          select.innerHTML = "";
          if (snapshot.empty) {
            select.innerHTML = '<option value="">No hay campeonatos</option>';
            return;
          }
          snapshot.forEach((doc) => {
            const opt = document.createElement("option");
            opt.value = doc.id; opt.textContent = doc.data().name;
            select.appendChild(opt);
          });
          if (select.options.length > 0) {
            select.value = select.options[0].value;
            resetAndLoad();
          }
        } catch (e) { console.error(e); }
      }

      async function resetAndLoad() {
        const campId = document.getElementById("campSelect").value;
        if (!campId) return;
        fixturesMap.clear();
        currentJornada = null;
        
        try {
          const snapshot = await db.collection("fixtures").where("championshipId", "==", campId).get();
          snapshot.forEach(doc => {
            fixturesMap.set(doc.id, doc.data());
          });
          renderNavigation();
        } catch (e) { console.error(e); }
      }

      function renderNavigation() {
        const jornadasGrid = document.getElementById("jornadasContainer");
        const matchesList = document.getElementById("matchesContainer");

        if (currentJornada === null) {
          jornadasGrid.classList.remove("d-none");
          matchesList.classList.add("d-none");
          matchesList.innerHTML = "";

          let jornadasProgramadas = new Set();
          let counts = {};

          fixturesMap.forEach(meta => {
            meta.data.forEach(x => {
                // Solo incluimos partidos que tengan fecha y hora asignada (distintos de los valores por defecto)
                const isProgrammed = x.fechaRealAsignadaText && 
                                   x.fechaRealAsignadaText !== 'Por Definir' &&
                                   x.horaRealAsignada && 
                                   x.horaRealAsignada !== '--:--';

                if (!x.isRest && x.local !== "DESCANSA" && x.visitor !== "DESCANSA" && isProgrammed) {
                    jornadasProgramadas.add(x.jornada);
                    counts[x.jornada] = (counts[x.jornada] || 0) + 1;
                }
            });
          });

          // Convertir set a array y ordenar
          const sortedJornadas = Array.from(jornadasProgramadas).sort((a, b) => a - b);

          jornadasGrid.innerHTML = "";
          if (sortedJornadas.length === 0) {
              jornadasGrid.innerHTML = '<div class="col-12 text-center py-5"><i class="fas fa-calendar-times mb-3 opacity-25" style="font-size:3rem"></i><h5 class="text-white-50">No hay jornadas programadas aún</h5></div>';
              return;
          }

          sortedJornadas.forEach(j => {
            jornadasGrid.insertAdjacentHTML("beforeend", `
                <div class="col">
                    <div class="jornada-card-elite" onclick="selectJornada(${j})">
                        <i class="fas fa-calendar-alt"></i>
                        <h5>Jornada ${j}</h5>
                        <span class="match-count">${counts[j]} PARTIDOS LISTOS</span>
                    </div>
                </div>
            `);
          });
        } else {
          jornadasGrid.classList.add("d-none");
          matchesList.classList.remove("d-none");
          renderMatches();
        }
      }

      function selectJornada(j) {
        currentJornada = j;
        renderNavigation();
      }

      function backToJornadas() {
        currentJornada = null;
        renderNavigation();
      }

      async function renderMatches() {
        // Cargar mapa de logos de equipos una vez
        const teamsSnapshot = await db.collection("teams").where("championshipId", "==", document.getElementById("campSelect").value).get();
        const logosMap = {};
        teamsSnapshot.forEach(doc => {
            logosMap[doc.data().name] = doc.data().logo || 'img/logo.png';
        });

        const container = document.getElementById("matchesContainer");
        container.innerHTML = `
            <div class="d-flex justify-content-between align-items-center mb-5 px-3">
                <button class="btn-back-jornadas" onclick="backToJornadas()">
                    <i class="fas fa-arrow-left me-2"></i> Volver
                </button>
                <div class="text-center">
                    <h4 class="text-white mb-0 text-uppercase fw-900" style="letter-spacing:3px">JORNADA ${currentJornada}</h4>
                    <small class="text-primary-glow">Selecciona un encuentro para iniciar el acta</small>
                </div>
                <div style="width:110px"></div>
            </div>
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4 px-2" id="matchCardsGrid"></div>
        `;

        const grid = document.getElementById("matchCardsGrid");
        let matches = [];
        fixturesMap.forEach((meta, fixId) => {
          meta.data.forEach(m => {
            if (m.jornada === currentJornada && !m.isRest && m.local !== "DESCANSA" && m.visitor !== "DESCANSA") {
              matches.push({ ...m, _cat: meta.category, _fixId: fixId });
            }
          });
        });

        const dayOrder = { "Viernes": 1, "Sábado": 2, "Domingo": 3 };
        matches.sort((a, b) => {
          if (dayOrder[a.fechaRealAsignadaText] !== dayOrder[b.fechaRealAsignadaText])
            return dayOrder[a.fechaRealAsignadaText] - dayOrder[b.fechaRealAsignadaText];
          return (a.horaRealAsignada || "99:99").localeCompare(b.horaRealAsignada || "99:99");
        });

        matches.forEach(m => {
          const cardCol = document.createElement("div");
          cardCol.className = "col";
          const localLogo = logosMap[m.local] || 'img/logo.png';
          const visitorLogo = logosMap[m.visitor] || 'img/logo.png';

          cardCol.innerHTML = `
            <div class="jornada-card-elite h-100 d-flex flex-column justify-content-between p-4" onclick="openVocalActa(${JSON.stringify(m).replace(/"/g, '&quot;')})">
                <div class="mb-3 text-center">
                    <span class="badge bg-primary-glass mb-4 text-uppercase" style="font-size:0.5rem; letter-spacing:2px; opacity:0.7">${m._cat}</span>
                    <div class="d-flex align-items-center justify-content-center gap-2 mb-2">
                        <div style="flex:1">
                            <img src="${localLogo}" alt="Logo Local" class="mb-2" style="width:35px; height:35px; border-radius:50%; object-fit:cover; border:1px solid rgba(255,255,255,0.1)">
                            <div class="text-white fw-800" style="font-size:0.75rem; text-transform:uppercase; line-height:1">${m.local}</div>
                        </div>
                        <div class="text-primary-glow fw-900" style="font-size:0.5rem; opacity:0.5">VS</div>
                        <div style="flex:1">
                            <img src="${visitorLogo}" alt="Logo Visitante" class="mb-2" style="width:35px; height:35px; border-radius:50%; object-fit:cover; border:1px solid rgba(255,255,255,0.1)">
                            <div class="text-white fw-800" style="font-size:0.75rem; text-transform:uppercase; line-height:1">${m.visitor}</div>
                        </div>
                    </div>
                </div>
                <div class="pt-3 border-top border-secondary border-opacity-25 text-center">
                    <div class="d-flex justify-content-center align-items-center gap-2 mb-3">
                        <span class="text-white-50" style="font-size:0.85rem">
                            <i class="far fa-calendar-alt me-1 text-primary-glow" style="font-size:1rem"></i> ${m.fechaRealAsignadaText}
                        </span>
                        <span class="mx-1 opacity-10">|</span>
                        <span class="text-white-50" style="font-size:0.85rem">
                            <i class="far fa-clock me-1 text-primary-glow" style="font-size:1rem"></i> ${m.horaRealAsignada}
                        </span>
                    </div>
                    <div class="d-flex flex-column align-items-center gap-1">
                        <div style="font-size:0.75rem; color:#f1c40f; line-height:1.1">
                            <span class="text-white-50" style="font-size:0.6rem; letter-spacing:1px; opacity:0.8">VOCAL:</span> ${m.vocalAsignado}
                        </div>
                        <div style="font-size:0.75rem; color:#f1c40f; line-height:1.1">
                            <span class="text-white-50" style="font-size:0.6rem; letter-spacing:1px; opacity:0.8">VEEDOR:</span> ${m.veedorAsignado}
                        </div>
                    </div>
                </div>
            </div>
          `;
          grid.appendChild(cardCol);
        });
      }

      function openVocalActa(match) {
        // Redirigir o Abrir Modal? El usuario dice "que me lleve a la pantalla de la vocalía digital"
        // Dado que la vocalía digital es compleja, lo mejor es un modal XL o una página nueva.
        // Reutilizaré la lógica de acta que ya existía pero con los datos dinámicos.
        
        const modalBody = document.getElementById("modalVocalBody");
        modalBody.innerHTML = `
            <div class="text-center py-5">
                <i class="fas fa-spinner fa-spin fa-3x text-primary-glow mb-3"></i>
                <h6 class="text-white-50">Cargando Acta Digital de ${match.local} vs ${match.visitor}...</h6>
            </div>
        `;
        
        const modal = new bootstrap.Modal(document.getElementById("vocaliaModal"));
        modal.show();

        // Cargar vista de acta (Simulado o real si existe el componente)
        setTimeout(() => {
           renderActaInterior(match);
        }, 800);
      }

      function renderActaInterior(m) {
          const body = document.getElementById("modalVocalBody");
          body.innerHTML = `
            <div class="row g-4">
                <div class="col-md-6">
                    <div class="glass-panel p-4 h-100">
                        <h5 class="text-primary-glow mb-4 text-center text-uppercase">${m.local}</h5>
                        <div id="playersLocal" class="row row-cols-3 g-2">
                             <div class="col text-center py-4 text-white-50"><small>Cargando Nómina...</small></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="glass-panel p-4 h-100 border-info">
                        <h5 class="text-info mb-4 text-center text-uppercase">${m.visitor}</h5>
                        <div id="playersVisitor" class="row row-cols-3 g-2">
                             <div class="col text-center py-4 text-white-50"><small>Cargando Nómina...</small></div>
                        </div>
                    </div>
                </div>
                <div class="col-12">
                   <div class="glass-panel p-4">
                       <h6 class="text-warning text-uppercase mb-3">Informe de Mesa (Vocal: ${m.vocalAsignado})</h6>
                       <textarea class="select-premium" rows="3" placeholder="Ingresar novedades del encuentro..."></textarea>
                       <div class="mt-4 text-center">
                           <button class="btn-premium px-5" onclick="Swal.fire('Guardado', 'Acta enviada correctamente', 'success').then(()=> bootstrap.Modal.getInstance(document.getElementById('vocaliaModal')).hide())">
                              <i class="fas fa-check-circle me-2"></i> Finalizar y Guardar Acta
                           </button>
                       </div>
                   </div>
                </div>
            </div>
          `;
          loadNominas(m.local, m.visitor, m._cat);
      }

      async function loadNominas(local, visitor, cat) {
          // Lógica para cargar jugadores de Firestore
          const catsMap = { "MÁXIMA": "maxima", "PRIMERA": "primera", "FEMENINO": "femenino" };
          const normalizedCat = catsMap[cat] || cat.toLowerCase();

          const fetchTeam = async (name, containerId) => {
              const snap = await db.collection("players").where("teamName", "==", name).where("teamCategory", "==", normalizedCat).get();
              const cont = document.getElementById(containerId);
              cont.innerHTML = "";
              if(snap.empty) cont.innerHTML = "<div class='col-12 text-center py-3'>Sin jugadores</div>";
              snap.forEach(doc => {
                  const p = doc.data();
                  cont.insertAdjacentHTML("beforeend", `
                    <div class="col">
                        <div class="p-2 border border-secondary rounded text-center small text-white" style="background:rgba(0,0,0,0.2)">
                            <div class="fw-bold fs-5">#${p.numeroJugador}</div>
                            <div style="font-size:0.6rem">${p.nombres.split(' ')[0]}</div>
                        </div>
                    </div>
                  `);
              });
          };

          await Promise.all([
              fetchTeam(local, "playersLocal"),
              fetchTeam(visitor, "playersVisitor")
          ]);
      }
    </script>
  </body>
</html>
